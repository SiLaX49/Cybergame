id: r-lycee-webcam
theme: rencontres
tranches: ['lycee']
titre: Derrière l’écran
resume: 'Un mail qui prétend avoir piraté ta webcam, un profil qui refuse toute visio, une amie dont une photo circule : démêler le bluff du danger, et ne jamais rester seul·e.'
duree: 20
objectifs:
  - Reconnaître un chantage envoyé en masse (« j’ai piraté ta webcam ») et un faux profil sur une appli pour se faire des amis
  - 'Réagir au chantage et à la diffusion d’une photo : ne pas payer, garder des preuves, signaler, appeler le 3018'
  - Soutenir une amie dont une photo circule, sans relancer la diffusion
competences:
  crcn: ['4.3', '4.2', '2.1']
  programmes: ['SNT 2de', 'EMC lycée']
etapes:
  - type: scenario
    id: mail-webcam
    role: victime
    ecran:
      app: mail
      appNom: Mail
      contact: 'Inconnu'
      adresse: 'hk.admin@secu-alerte.xyz'
      sujet: 'Ton mot de passe : tournesol2019'
      messages:
        - de: contact
          texte: 'Je connais ton mot de passe : tournesol2019. J’ai piraté ta webcam et ton ordinateur, et j’ai enregistré des vidéos de toi. Envoie 300 € en cryptomonnaie sous 48 h, ou je les envoie à tous tes contacts. Ne parle de ce mail à personne.'
          heure: '03:12'
    question: 'Tournesol2019, c’est un vieux mot de passe que tu as vraiment utilisé il y a quelques années. Que fais-tu ?'
    choix:
      - id: paie
        texte: 'Il connaît mon vrai mot de passe, donc il dit peut-être vrai : je paie pour être tranquille.'
        qualite: risque
        geste: payer
        consequence: 'Aucune vidéo n’existait : ce mail est envoyé à des milliers de personnes, avec des mots de passe volés lors d’anciennes fuites de données. Après ton paiement, un nouveau mail réclame plus. Ce n’est pas ta faute : ces arnaqueurs savent exactement comment faire peur. Ne paie plus, n’envoie rien de plus, garde le mail comme preuve et signale-le.'
        reaction: 'Paiement reçu. Ce n’est pas assez : encore 300 € sous 24 h.'
      - id: ignore
        texte: 'Je ne réponds pas, je signale le mail comme arnaque et je change ce vieux mot de passe partout où il sert encore.'
        qualite: bon
        geste: signaler
        consequence: 'Rien ne se passe après 48 h : c’était un bluff. Le mot de passe venait d’une ancienne fuite de données. En le changeant, tu fermes aussi la porte aux vrais pirates.'
        reaction: 'Dernier rappel : il te reste 24 h.'
      - id: aide
        texte: 'Je demande de l’aide : j’appelle le 3018 avant de faire quoi que ce soit.'
        qualite: aide
        consequence: 'L’écoutante du 3018 reconnaît tout de suite ce mail : des milliers de personnes reçoivent le même. Elle t’explique que c’est un bluff, qu’il ne faut pas payer, et comment le signaler. Tu changes ton vieux mot de passe, et tu te sens plus léger·e.'
    indices:
      - { id: sans-preuve, libelle: 'Le mail ne montre aucune preuve, à part un vieux mot de passe', passage: 'Je connais ton mot de passe' }
      - { id: crypto, libelle: 'Il réclame de la cryptomonnaie sous 48 h', passage: '300 € en cryptomonnaie sous 48 h' }
      - { id: silence, libelle: 'Il me demande de n’en parler à personne', passage: 'Ne parle de ce mail à personne' }
    explicationIndices: 'Le mot de passe vient d’une ancienne fuite de données : c’est la seule « preuve », et elle ne dit rien sur ta webcam. Aucune vidéo montrée, un délai, de la cryptomonnaie et une demande de silence : c’est une arnaque envoyée en masse.'
    aRetenir: 'Un mail « j’ai piraté ta webcam » est presque toujours un bluff envoyé en masse. Ne paie pas, ne réponds pas, n’envoie rien de plus. Garde le mail, signale-le et change le mot de passe cité. Si ça t’inquiète, le 3018 t’écoute : ce n’est pas ta faute.'
    recuperation: { action: capture-preuve, siChoix: [paie] }
    pourquoi:
      - levier: peur
        truc: '« Des vidéos de toi » envoyées « à tous tes contacts », avec ton vrai mot de passe « tournesol2019 » : la menace est faite pour paniquer. Ce mot de passe vient en fait d’une vieille fuite de données.'
        parade: 'Une menace sans aucune preuve est un bluff, et un vieux mot de passe cité ne prouve pas un piratage. Parles-en avant d’agir.'
      - levier: urgence
        truc: '« Sous 48 h » : le délai sert à te faire payer avant d’en parler à quelqu’un.'
        parade: 'Prends le temps. Une vraie menace comme une fausse se traite en en parlant, pas en payant.'
      - levier: secret
        truc: '« Ne parle de ce mail à personne » : l’arnaqueur veut que tu restes seul·e face à sa menace.'
        parade: 'Quand on te demande de garder une menace secrète, c’est le moment d’en parler. Ces mails arrivent à des milliers de gens, adultes compris.'

  - type: scenario
    id: profil-sans-visio
    role: victime
    ecran:
      app: chat
      appNom: SnapTalk
      contact: 'Sam, 17 ans'
      messages:
        - de: contact
          texte: 'Désolé pour la visio, ma caméra marche toujours pas 😕 Mais je te jure que je suis comme sur mes photos.'
          heure: '20:14'
        - de: contact
          texte: 'Tu peux m’envoyer des photos de toi ? Des vraies, juste pour moi.'
          heure: '20:15'
        - de: contact
          texte: 'Et j’ai un souci : tu pourrais me prêter 40 € pour mon forfait ? Je te rembourse lundi, promis.'
          heure: '20:17'
    question: Vous vous êtes connus sur SnapTalk. Vous parlez depuis un mois, et Sam a toujours refusé les appels vidéo. Que fais-tu ?
    choix:
      - id: prete
        texte: 'Je lui prête les 40 €, il me remboursera lundi. Sam m’a tellement soutenu·e ce mois-ci.'
        qualite: risque
        geste: payer
        consequence: 'Lundi, pas de remboursement : Sam demande 80 € de plus et insiste pour les photos. Quand tu hésites, il dit que tu ne tiens pas à lui. Le profil était faux : ses photos avaient été volées à quelqu’un d’autre. Ce n’est pas ta faute : c’est lui qui ment depuis le début. Bloque, signale, et parles-en.'
        reaction: 'Merci ❤️ Tu vois, on se fait confiance. Tu m’envoies les photos ?'
      - id: refuse
        texte: 'Je n’envoie ni photo ni argent. Un mois sans visio, c’est louche : je bloque et je signale ce profil.'
        qualite: bon
        geste: bloquer
        consequence: 'Le profil de Sam disparaît quelques jours plus tard : d’autres personnes l’avaient signalé. Ses photos étaient volées. Tu n’as rien perdu, et tu as protégé d’autres utilisateurs.'
      - id: aide
        texte: 'Je demande de l’aide à l’infirmière du lycée avant de répondre à Sam.'
        qualite: aide
        consequence: 'L’infirmière t’écoute sans juger. Elle t’explique que refuser la visio puis demander photos et argent, c’est le schéma d’un faux profil. Vous signalez le compte, et elle te donne le numéro du 3018 au cas où Sam insisterait.'
    indices:
      - { id: visio, libelle: 'Sam refuse toute visio depuis un mois', passage: 'ma caméra marche toujours pas' }
      - { id: photos, libelle: 'Il me demande des photos « juste pour moi »', passage: 'juste pour moi' }
      - { id: argent, libelle: 'Il me demande de l’argent', passage: 'me prêter 40 €' }
    explicationIndices: 'Refuser toute visio permet de cacher qui on est vraiment. Demander des photos puis de l’argent, c’est le schéma classique des faux profils. L’âge affiché ne prouve rien.'
    aRetenir: 'Quelqu’un qui refuse de se montrer mais réclame photos et argent cache quelque chose. Tu ne dois rien envoyer, ni photo ni argent. Bloque, signale, et parles-en : le 3018 aide aussi dans ces situations.'
    recuperation: { action: bloquer-signaler, siChoix: [prete] }
    pourquoi:
      - levier: confiance
        truc: '« Je te jure que je suis comme sur mes photos » : après un mois de discussions, tu as envie de le croire.'
        parade: 'Tant que tu ne l’as pas vu, même en visio, tu ne sais pas qui écrit.'
      - levier: flatterie
        truc: 'Sam te soutient et te dit des choses gentilles depuis un mois. Tu te sens important·e pour lui.'
        parade: 'Des mots gentils ne disent pas qui est derrière l’écran. Une vraie personne accepte de se montrer.'
      - levier: petit-montant
        truc: '« 40 € pour mon forfait », ça semble peu pour aider quelqu’un qui compte pour toi.'
        parade: 'Une première petite somme ouvre la porte aux suivantes. Ne prête pas d’argent à quelqu’un que tu n’as jamais vu.'

  - type: scenario
    id: photo-circule
    role: temoin
    ecran:
      app: chat
      appNom: SnapTalk
      contact: 'Inès'
      messages:
        - de: contact
          texte: 'Une photo de moi qui devait rester privée tourne sur un compte anonyme. Plein de gens du lycée l’ont vue.'
          heure: '21:52'
        - de: contact
          texte: 'Je sais plus quoi faire. J’ose même plus aller en cours demain.'
          heure: '21:53'
    question: Inès est ton amie. Sous la photo, des commentaires moqueurs s’accumulent. Que fais-tu ?
    choix:
      - id: commente
        texte: 'Je vais sous la publication répondre à ceux qui se moquent. Il faut bien que quelqu’un défende Inès !'
        qualite: risque
        geste: ouvrir-lien
        consequence: 'Ton commentaire part d’une bonne intention, mais il fait remonter la publication, et d’autres la voient. Ce n’est pas ta faute : le seul responsable est celui qui a publié la photo. Il est encore temps : écris à Inès en privé, et aidez-la à demander son retrait.'
        reaction: 'Merci de vouloir me défendre… mais là, encore plus de gens la voient 😣'
      - id: prive
        texte: 'J’écris à Inès que ce n’est pas sa faute. Je l’aide à noter le nom du compte et le lien de la publication, sans enregistrer la photo, et à le signaler.'
        qualite: bon
        geste: repondre
        reponse: 'Ce n’est pas ta faute. On note le nom du compte et le lien, et on le signale ensemble ?'
        consequence: 'Inès se sent moins seule. Vous signalez le compte et gardez des preuves des messages, sans repartager l’image. Elle accepte de prévenir la CPE le lendemain matin.'
        reaction: 'Merci… Ça m’aide de ne pas être seule.'
      - id: aide
        texte: 'Je demande de l’aide au 3018 avec Inès ce soir : il peut demander le retrait de la photo.'
        qualite: aide
        consequence: 'Le 3018 écoute Inès et signale la publication aux plateformes, qui peuvent la retirer rapidement. Il lui explique que diffuser une photo privée sans accord est puni par la loi, et comment porter plainte si elle le souhaite.'
    indices:
      - { id: detresse, libelle: 'Inès n’ose plus aller en cours', passage: 'J’ose même plus aller en cours' }
      - { id: diffusion, libelle: 'Beaucoup de gens du lycée ont déjà vu la photo', passage: 'Plein de gens du lycée l’ont vue' }
    explicationIndices: 'Inès va mal et la photo se répand vite : il faut agir sans attendre. Un compte anonyme n’empêche rien : il peut être signalé, et la justice peut retrouver qui est derrière.'
    aRetenir: 'Si une photo d’un ami circule : ne la repartage pas (la transférer, c’est aussi la diffuser), ne commente pas, écris-lui en privé que ce n’est pas sa faute. Signalez la publication et appelez le 3018 : il peut demander son retrait. Diffuser une photo privée sans accord est puni par la loi.'
    recuperation: { action: soutenir, siChoix: [commente] }
    pourquoi:
      - levier: colere
        truc: 'Les moqueries sous la photo te mettent en colère. Tu veux répondre tout de suite.'
        parade: 'Ne réponds pas en public : ça fait remonter la publication. Garde les preuves et écris à Inès en privé.'
      - levier: groupe
        truc: '« Plein de gens du lycée l’ont vue » : tout le monde commente, alors tu veux commenter aussi, pour la défendre.'
        parade: 'Chaque commentaire, même gentil, rend la publication plus visible. Le signalement, lui, peut la faire retirer.'
      - levier: reflexe
        truc: 'Répondre sous une publication, tu le fais tous les jours, en un geste.'
        parade: 'Avant de commenter, demande-toi si ça aide Inès ou si ça montre la photo à plus de monde.'

  - type: minijeu
    id: repere-conversation
    jeu: repere
    config:
      consigne: 'Voici une conversation avec une personne rencontrée sur une appli pour se faire des amis. Trouve les 5 signaux d’alerte. Si tu les repères un jour, tu n’as rien d’autre à faire que d’en parler à quelqu’un de confiance.'
      titre: 'Kalio : conversation avec Lou'
      lignes:
        - { id: amis, texte: 'Hey, on a des amis en commun je crois ?' }
        - { id: compliments, texte: 'En deux jours, tu me comprends mieux que tout le monde.', indice: true, explication: 'Un lien aussi fort, aussi vite, avec quelqu’un qu’on ne connaît pas : c’est souvent une façon de gagner ta confiance.' }
        - { id: musique, texte: 'Tu écoutes quoi en ce moment ?' }
        - { id: cadeau, texte: 'Je t’ai offert un mois d’abonnement musique, cadeau.', indice: true, explication: 'Un cadeau crée une dette : on se sent ensuite obligé de rendre la pareille.' }
        - { id: terminale, texte: 'Moi je suis en terminale, et toi ?' }
        - { id: rencontre, texte: 'On se voit samedi ? Viens seul·e, ce sera plus simple.', indice: true, explication: 'Une rencontre où il faut venir seul·e, avec quelqu’un jamais vu en visio : c’est un danger. Préviens toujours quelqu’un.' }
        - { id: secret, texte: 'Dis à personne qu’on se voit, ils vont tout gâcher.', indice: true, explication: 'Le secret coupe des proches qui pourraient te protéger.' }
        - { id: menace, texte: 'Si tu viens pas, je montre nos messages à tout le monde.', indice: true, explication: 'C’est une menace. Garde des captures, bloque, signale, et appelle le 3018.' }
debrief:
  questions:
    - Comment distinguer un chantage envoyé en masse d’une menace plus ciblée ?
    - Quels signaux montrent qu’un profil en ligne est faux ?
    - Comment aider une amie dont une photo circule, sans aggraver la situation ?
  reponses: 'Un mail envoyé en masse ne montre aucune preuve, cite au mieux un vieux mot de passe volé, et réclame de l’argent dans un délai : c’est un bluff. Dans tous les cas de chantage : ne paie pas, n’envoie rien de plus, garde des preuves, bloque, signale, appelle le 3018. Un faux profil refuse la visio, va vite, demande des photos puis de l’argent. Pour une amie : ne pas repartager, ne pas commenter, lui écrire en privé que ce n’est pas sa faute, signaler, appeler le 3018 qui peut demander le retrait de la photo, et prévenir un adulte du lycée. Transférer la photo, c’est aussi la diffuser. Diffuser une photo privée de quelqu’un sans son accord, et faire chanter quelqu’un, sont des délits. Si tu repères ces signaux un jour, tu n’as rien d’autre à faire que d’en parler à quelqu’un de confiance.'
  erreursFrequentes:
    - 'Croire que le mail dit vrai parce qu’il cite un vrai mot de passe.'
    - 'Penser qu’on est responsable d’une photo diffusée sans son accord : le responsable est celui qui la diffuse.'
    - 'Commenter une publication pour défendre la victime, ce qui la rend plus visible.'
fiche:
  deroulement: |
    5 min : cadre. Les prénoms sont fictifs. Personne n’a à raconter sa vie ; « Passer ce scénario » est possible ; l’infirmier·e ou la CPE reste disponible après la séance.
    20 min : jeu, en binômes ou en classe entière vidéoprojetée.
    20 min : débrief des 3 questions, puis retour sur le mini-jeu (les 5 signaux d’alerte). Rappeler que le chantage et la diffusion d’une image privée sans accord sont des délits.
    5 min : où trouver de l’aide (CPE, infirmier·e, 3018 qui peut demander le retrait d’un contenu, 119, Pharos sur internet-signalement.gouv.fr, cybermalveillance.gouv.fr pour le mail « webcam », 17 en cas de danger immédiat). SnapTalk et Kalio sont présentées comme des applis pour se faire des amis : les applis de rencontre amoureuse sont réservées aux majeurs.
    5 min : engagement. Je change aujourd’hui un vieux mot de passe que j’utilise encore, et je note le 3018.
  siRevelation: 'Si un élève se confie pendant ou après la séance : l’écouter au calme, sans juger et sans promettre le secret (lui dire qu’on va en parler à des personnes qui peuvent le protéger). Ne pas l’interroger, ne pas demander à voir ni copier les images, et ne pas les transférer, même pour les montrer à un collègue ; noter ses mots exacts, avec la date. Lui dire de ne pas payer et de ne plus répondre. Ne pas contacter soi-même l’auteur. Prévenir sans attendre le ou la CPE, l’infirmier·e scolaire et le chef d’établissement. Si d’autres élèves sont impliqués (diffusion, moqueries), appliquer le protocole pHARe. Si l’élève est en danger ou risque de l’être, le chef d’établissement transmet une information préoccupante à la cellule départementale (CRIP), ou un signalement au procureur en cas de danger grave et immédiat. Orienter vers le 3018, qui peut demander le retrait d’un contenu, et vers le 119. Si l’élève paraît en grande détresse ou parle de mourir : ne pas le laisser seul, prévenir immédiatement l’infirmier·e et le chef d’établissement, et appeler le 3114 (prévention du suicide, 24 h/24). Repère légal : une image à caractère sexuel d’un mineur est, pour la loi, une image pédopornographique. La détenir ou la transférer est interdit, même avec l’accord de la personne et même entre mineurs. Ne jamais demander à la voir ; la signaler au 3018 ou sur Pharos (internet-signalement.gouv.fr).'
relecture:
  statut: a-relire
