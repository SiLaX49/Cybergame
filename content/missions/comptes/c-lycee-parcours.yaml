  - type: lieu
    id: job-ete
    lieu: L’imprimerie Encre Vive
    decor: entreprise
    guide: 'En juillet, tu fais un job d’été à l’imprimerie Encre Vive. Premier matin : Mme Carvalho, ta tutrice, t’a créé un compte sur l’ordinateur de l’accueil, et t’a présenté Rachid, l’informaticien, au bureau d’à côté. Un message arrive d’un numéro inconnu : « Bonjour, ici Kevin, du service informatique d’Encre Vive. Pour activer ton compte, envoie-moi le code que tu vas recevoir par SMS. C’est urgent, l’accueil ouvre à 9 h. »'
    question: Le SMS de code vient d’arriver. Que fais-tu ?
    choix:
      - id: envoie
        texte: 'C’est le service informatique de l’imprimerie : j’envoie le code pour ne pas bloquer l’accueil.'
        qualite: risque
        reaction: 'Il n’y a pas de Kevin à l’imprimerie, et ce code ouvrait ton compte. Un code de connexion ne se donne à personne, même à quelqu’un qui dit être du service informatique. Va voir Mme Carvalho et Rachid tout de suite : ton compte peut encore être sécurisé.'
      - id: verifie
        texte: 'Je ne donne aucun code, et je vais voir Rachid, au bureau d’à côté, pour vérifier.'
        qualite: bon
        reaction: 'Bien vu. Rachid lève les yeux : « Kevin ? Il n’y a pas de Kevin ici. Et un code, je ne le demande jamais. » Il prévient Mme Carvalho, et ton compte est prêt avant l’ouverture.'
      - id: aide
        texte: 'Je demande de l’aide à Mme Carvalho, ma tutrice, avant de répondre quoi que ce soit.'
        qualite: aide
        reaction: 'Mme Carvalho fronce les sourcils : « Kevin ? Notre informaticien, c’est Rachid. » Elle va le voir avec toi : le message est faux. Rachid vérifie ton compte avant l’ouverture.'
    pourquoi:
      - levier: autorite
        truc: '« du service informatique d’Encre Vive » : le message a l’air de venir de l’entreprise.'
        parade: 'N’importe qui peut écrire le nom d’une entreprise. Vérifie en personne, auprès de ceux que tu connais.'
      - levier: urgence
        truc: '« C’est urgent, l’accueil ouvre à 9 h » : tu ne veux pas mal commencer ton premier jour.'
        parade: 'Un premier jour, on a le droit de vérifier. Poser la question prend une minute.'
      - levier: reflexe
        truc: 'Un code arrive juste après la création de ton compte : la demande paraît logique.'
        parade: 'Un code de connexion ne se donne à personne, même à quelqu’un qui dit être du service informatique.'
    aRetenir: 'Un code de connexion ne se donne à personne, même à quelqu’un qui dit être du service informatique. Sur toute l’île, le même réflexe : vérifier par un autre canal et, si c’est déjà fait, sécuriser sa messagerie d’abord.'
    recuperation: { action: demander-aide, siChoix: [envoie] }
debrief:
  questions:
    - 'Qu’est-ce qui rendait la demande de code d’« Elias » si crédible, et comment pouvait-on vérifier ?'
    - 'Comparez les trois routes : qu’est-ce qu’on peut encore faire après une erreur ? Qui aide pour quoi ?'
    - 'Quel recours pour quelle situation : sécuriser soi-même, le référent numérique du lycée, ou 17Cyber ?'
  reponses: 'Les pièges de l’île : la confiance (le message vient du compte d’un ami), l’urgence (l’oral est demain, l’accueil ouvre à 9 h), le réflexe (le code est là, on le recopie) et l’air officiel (« service informatique »). Le SMS disait pourtant « NidMail » et « Ne le donne à personne ». Pour vérifier : un autre canal, en face ou par téléphone, jamais le compte suspect. Pourquoi le pirate a pu demander un code : il avait le mot de passe de la messagerie, réutilisé sur un site qui avait fuité. Trois routes : vérifier soi-même, demander à la bonne personne (référent numérique, parent, tutrice), ou réparer après avoir donné le code. Réparer, dans l’ordre : la messagerie d’abord, puis les mots de passe réutilisés, les moyens de récupération et les appareils connectés, la double authentification là où elle manque, et un message aux contacts. La double authentification protège beaucoup, mais pas tout. Un mot de passe par compte ; rien n’impose de le changer tous les mois, on le change quand il a pu être exposé. Recours : sécuriser soi-même depuis l’appli officielle ; le référent numérique pour l’ENT et les appareils du lycée ; 17Cyber pour un diagnostic et une orientation, qui n’est ni un numéro de téléphone ni une plainte automatique.'
  erreursFrequentes:
    - 'Donner un code de connexion à un ami qui le demande, sans vérifier par un autre canal.'
    - 'Changer seulement le mot de passe du compte touché, alors que le même servait ailleurs.'
    - 'Croire que la double authentification empêche tout piratage, ou qu’il faut changer son mot de passe tous les mois.'
fiche:
  deroulement: |
    5 min : cadre. Avez-vous déjà reçu un code de connexion que vous n’aviez pas demandé ? Combien de vos comptes partagent un mot de passe ? (sans obligation de répondre)
    25 min : traversée de l’île, en binômes ou en classe entière vidéoprojetée. À la demande de code d’« Elias », trois routes : vérifier auprès d’Elias, demander au référent numérique, ou donner le code puis réparer. Si plusieurs binômes jouent, répartir les trois routes.
    10 min : débrief. Comparez les trois routes : qu’est-ce qu’on peut encore faire après une erreur ? Qui aide pour quoi ? Puis retour sur le tri « le bon recours ».
    5 min : où trouver de l’aide (référent numérique du lycée pour l’ENT et ses appareils, parents, 17cyber.gouv.fr pour un diagnostic).
    5 min : engagement. Cette semaine, je vérifie quels comptes partagent le mot de passe de ma messagerie, et je commence par changer celui-là.
