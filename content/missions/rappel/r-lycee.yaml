id: r-lycee
type: rappel
themesCouverts: [phishing, jeux-achats]
tranches: ['lycee']
titre: Rappel express
resume: Cinq minutes, quelques notifications… et peut-être un piège. Tes réflexes sont-ils toujours là ?
duree: 5
objectifs:
  - Réutiliser les bons réflexes appris plus tôt
  - Repérer un piège glissé parmi des notifications normales
competences:
  crcn: ['4.1', '4.2']
  programmes: ['SNT 2de']
etapes:
  - type: fil
    id: fil-notifs
    consigne: Ton téléphone vibre plusieurs fois de suite. Pour chaque notification, que fais-tu ?
    notifications:
      - { id: vues, appNom: Revendo, de: Revendo, texte: 'Ton article « Veste en jean, taille M » a été vu 12 fois aujourd’hui 👀', explication: 'Vraie notification de l’appli : une simple info, sans lien ni demande.' }
      - { id: releve, appNom: BanqueNova, de: BanqueNova, texte: 'Ton relevé mensuel est disponible dans l’appli, rubrique Documents.', explication: 'Vraie notification de ton appli bancaire : pas de lien, pas de code demandé. Le relevé se consulte dans l’appli elle-même.' }
      - { id: lycee, appNom: Mon Lycée, de: Mon Lycée, texte: 'Nouveau message de M. Bernard (SES) : le contrôle de jeudi est décalé à vendredi.', explication: 'Message normal de l’ENT, qui ne demande rien.' }
      - { id: paiement, appNom: Revendo, de: Revendo, texte: 'Ton acheteur a payé ! Confirme la réception ici pour recevoir ton argent : revendo-paiement-securise.com', surprise: true, explication: 'Le piège ! Un vrai paiement apparaît directement dans l’appli : tu n’as jamais besoin d’aller sur un autre site ni de scanner un code pour être payé. Ce faux site sert à voler tes coordonnées bancaires.' }
      - { id: chloe, appNom: SnapTalk, de: Chloé, texte: 'On se retrouve à 14 h devant le ciné ? 🍿', explication: 'Message normal d’une amie.' }
  - type: scenario
    id: likes-payes
    ecran:
      app: chat
      appNom: SnapTalk
      contact: 'Emma (ta classe)'
      messages:
        - de: contact
          texte: 'Je t’ajoute à un groupe trop bien : on gagne 5 € par vidéo StreamTube likée, payé direct 💸 J’ai déjà touché 20 € ! Pour débloquer les missions mieux payées, il faut juste un dépôt de 50 € au début. Inscris-toi sur likes-remuneres.xyz, dis que tu viens de ma part.'
    question: Emma est dans ta classe et elle a l’air sûre d’elle. Que fais-tu ?
    choix:
      - id: depot
        texte: 'Emma a vraiment touché 20 €, elle me l’a dit. Les 50 € de dépôt, je les récupère en dix vidéos : je m’inscris et je paie.'
        qualite: risque
        consequence: 'Tu reçois 10 € pour tes deux premières vidéos likées. Puis le « manager » du groupe te réclame 150 € de plus « pour débloquer tes gains ». Tu ne peux jamais retirer ton argent, et il insiste pour que tu recrutes d’autres élèves. C’est une arnaque au faux job. Tu peux encore agir : garder des preuves, bloquer, prévenir un adulte et ta banque.'
      - id: parle-emma
        texte: 'Je ne verse rien et j’en parle à Emma en vrai : payer pour gagner de l’argent, c’est louche.'
        qualite: bon
        consequence: 'Emma t’explique qu’elle a bien reçu 20 €, mais qu’elle ne peut récupérer ni ses 50 € de dépôt, ni les 30 € de « frais » qu’on lui a demandés ensuite : le site en invente toujours de nouveaux. Vous gardez des captures et vous signalez le groupe ensemble.'
      - id: aide
        texte: Je demande de l’aide à un adulte avant de m’inscrire.
        qualite: aide
        consequence: 'Ta CPE reconnaît l’arnaque aux « likes payés » : les premiers petits gains servent d’appât pour obtenir des dépôts plus gros. Elle prévient les autres classes et aide Emma, qui avait déjà versé de l’argent, à faire le point avec ses parents et sa banque.'
    indices:
      - { id: payer-pour-gagner, libelle: 'On me demande de payer avant de pouvoir gagner de l’argent', pertinent: true }
      - { id: trop-facile, libelle: '5 € pour un simple like, c’est trop beau pour être vrai', pertinent: true }
      - { id: site, libelle: 'L’inscription se fait sur un site inconnu (likes-remuneres.xyz)', pertinent: true }
      - { id: deja-paye, libelle: 'Emma dit avoir déjà été payée', pertinent: false }
    explicationIndices: 'Un vrai travail ne demande jamais de payer pour commencer. Les premiers petits gains sont un appât : ils rendent l’offre crédible pour réclamer ensuite des dépôts plus gros. Qu’Emma ait touché 20 € ne prouve donc rien.'
    aRetenir: 'Une offre qui te paie pour liker mais te demande un dépôt est une arnaque, même relayée par un camarade. Si tu as payé : garde des preuves, bloque, préviens un adulte et ta banque.'
    recuperation: { action: capture-preuve, siChoix: [depot] }
    pourquoi:
      - levier: gain
        truc: '5 € par like, 20 € déjà touchés : le calcul paraît facile. Ces premiers petits gains sont l’appât pour obtenir ton dépôt.'
        parade: 'Demande-toi qui paierait 5 € pour un simple like. Un vrai job ne te fait jamais payer pour commencer.'
      - levier: confiance
        truc: 'L’offre arrive par Emma, de ta classe. Le site pousse ses membres à recruter : « dis que tu viens de ma part ».'
        parade: 'Parle à Emma en vrai et demande-lui si elle a pu récupérer ses 50 € de dépôt.'
      - levier: groupe
        truc: '« Un groupe trop bien » : on imagine plein de gens qui gagnent déjà. Ces arnaques grossissent justement en faisant recruter leurs membres.'
        parade: 'Avant de rejoindre un groupe qui promet de l’argent, cherche le nom du site suivi du mot « arnaque », ou montre-le à un adulte.'
      - levier: petit-montant
        truc: '« Il faut juste un dépôt de 50 € au début. » Le mot « juste » fait passer la somme pour un détail, puis d’autres frais arrivent.'
        parade: 'Payer pour pouvoir gagner de l’argent, c’est le signal de l’arnaque. Ne verse rien, même un petit dépôt.'
debrief:
  questions:
    - Quel était le piège caché dans les notifications ?
    - Quel indice pourras-tu réutiliser la prochaine fois ?
    - Que faire si tu as déjà payé ou donné tes coordonnées bancaires ?
  reponses: 'Le faux « acheteur a payé » reprend les indices de l’hameçonnage : un lien vers un site qui n’est pas celui de l’appli. Un vrai paiement se voit directement dans l’appli, sans autre site ni code à scanner. L’offre de likes payés, elle, fait payer pour gagner : c’est toujours une arnaque. Si c’est déjà arrivé : prévenir tout de suite un adulte et la banque (opposition sur la carte), garder des captures, bloquer et signaler (cybermalveillance.gouv.fr).'
  erreursFrequentes:
    - 'Croire qu’une notification qui porte le nom de l’appli vient forcément de l’appli.'
    - 'Penser qu’une offre est sérieuse parce qu’un camarade a déjà reçu un peu d’argent.'
    - 'Bloquer tout de suite sans garder de preuves.'
fiche:
  deroulement: |
    À lancer 7 jours puis 30 jours après une mission (la carte le propose aux élèves).
    5 min : jeu, sans prévenir qu’un piège est caché.
    10 min : débrief. Qui a repéré le piège ? Quel indice ?
    Engagement : ne jamais payer pour décrocher un « job », et vérifier un paiement dans l’appli plutôt que par un lien.
