id: a-college-hors-store
theme: appareils
tranches: ['5e-3e']
titre: Gratuit, vraiment ?
resume: 'Une appli « premium gratuite », un QR code de Wi-Fi au festival, une extension de mode sombre : quand c’est gratuit et pratique, regarde ce que tu donnes en échange.'
duree: 18
objectifs:
  - Repérer les risques d’une appli installée hors du magasin d’applis
  - Reconnaître un faux portail Wi-Fi qui réclame le mot de passe d’un compte
  - Évaluer les autorisations d’une appli ou d’une extension avant de les accepter
competences:
  crcn: ['4.1', '4.2', '5.1']
  programmes: ['EMI cycle 4']
etapes:
  - type: scenario
    id: premium-gratuit
    ecran:
      app: web
      appNom: Navigateur
      contact: 'MélodiBox Premium Gratuit'
      url: 'melodibox-premium-free.xyz'
      messages:
        - de: contact
          texte: 'MélodiBox Premium DÉBLOQUÉ : musique sans pub, écoute hors ligne, morceaux illimités. 100 % gratuit, à vie !'
        - de: contact
          texte: 'Télécharge le fichier MélodiBox_Premium_Mod (38 Mo). Avant l’installation, autorise « Installer des applis inconnues » dans tes réglages.'
        - de: contact
          texte: 'Au premier lancement, connecte-toi avec ton compte MélodiBox habituel pour retrouver tes playlists.'
    question: 'L’abonnement MélodiBox Premium coûte 10 € par mois. Ce site est arrivé en tête quand tu as cherché « mélodibox premium gratuit ». Que fais-tu ?'
    choix:
      - id: installe
        texte: '10 € par mois, c’est tout mon argent de poche. Là, c’est gratuit à vie : j’installe.'
        qualite: risque
        geste: installer
        consequence: 'L’appli fonctionne… quelques jours. Mais elle t’a fait taper ton identifiant et ton mot de passe MélodiBox, et ils sont partis chez les pirates. Ton compte est repris, et des pubs plein écran s’ouvrent toutes seules sur ton téléphone. Tu peux reprendre la main : supprime l’appli, puis change ton mot de passe MélodiBox, et partout où tu utilises le même.'
        reaction: 'Installation réussie ! Connecte-toi maintenant avec ton compte MélodiBox.'
      - id: officiel
        texte: 'Je garde la version gratuite officielle, avec ses pubs, ou je regarde s’il existe une offre famille à partager à la maison.'
        qualite: bon
        geste: fermer
        consequence: 'Tu restes sur la version gratuite du magasin d’applis. Les pubs sont pénibles, mais ton compte et ton téléphone sont en sécurité. Ton père trouve même l’offre famille intéressante.'
        reaction: 'Attends ! L’offre Premium gratuite expire dans 10 minutes !'
      - id: aide
        texte: Je demande de l’aide à un adulte avant de toucher aux réglages du téléphone.
        qualite: aide
        consequence: 'Ton oncle est clair : « Une appli modifiée, on ne sait pas ce qu’on a ajouté dedans. Et ce réglage enlève une protection du téléphone. » Tu fermes la page.'
    indices:
      - { id: hors-magasin, libelle: 'Le fichier se télécharge en dehors du magasin d’applis', passage: 'Télécharge le fichier MélodiBox_Premium_Mod' }
      - { id: reglage, libelle: 'On me demande d’autoriser l’installation d’applis inconnues', passage: 'Installer des applis inconnues' }
      - { id: gratuit-vie, libelle: 'Un abonnement payant devient « gratuit, à vie »', passage: 'gratuit, à vie' }
    explicationIndices: 'Une version « premium gratuite » est une copie modifiée par un inconnu : personne ne sait ce qu’il y a ajouté. Le réglage « Installer des applis inconnues » désactive une protection du téléphone. Un abonnement payant qui devient « gratuit, à vie », c’est l’appât.'
    aRetenir: 'Une appli payante proposée gratuitement hors du magasin d’applis est presque toujours modifiée, souvent pour voler des comptes ou afficher des pubs. Reste dans le magasin d’applis, et laisse désactivé le réglage qui autorise les applis inconnues.'
    recuperation: { action: changer-mdp, siChoix: [installe] }
    pourquoi:
      - levier: gain
        truc: '« 100 % gratuit, à vie ! » : un abonnement à 10 € par mois offert pour toujours. C’est trop beau, et c’est fait pour.'
        parade: 'Personne ne débloque gratuitement une appli payante. Si c’est gratuit hors du magasin d’applis, demande-toi ce que tu paies à la place.'
      - levier: autorite
        truc: 'Le site reprend le nom « MélodiBox Premium » pour faire officiel. Il n’a pourtant rien à voir avec MélodiBox.'
        parade: 'La vraie appli MélodiBox s’installe uniquement depuis le magasin d’applis. Tout autre fichier n’est pas le sien.'
      - levier: reflexe
        truc: 'Le site te guide pas à pas : « télécharge », « autorise », « connecte-toi ». On suit les étapes sans se demander pourquoi.'
        parade: 'Si une installation te demande de changer un réglage de sécurité, arrête-toi : c’est le signal d’alarme.'

  - type: scenario
    id: qr-wifi
    ecran:
      app: web
      appNom: Navigateur
      contact: 'Wi-Fi gratuit du Festival Basszik'
      url: 'wifi-festival-basszik.net/login'
      messages:
        - de: contact
          texte: 'Bienvenue sur le Wi-Fi gratuit du Festival Basszik ! 🎶 Connexion rapide, sans inscription.'
        - de: contact
          texte: 'Pour accéder à Internet, connecte-toi avec ton compte SnapTalk : identifiant et mot de passe.'
        - de: contact
          texte: 'Plus que 2 h de Wi-Fi offert aujourd’hui !'
    question: 'Au festival, le réseau ne passe presque pas. Une affiche montre un QR code « Wi-Fi gratuit du festival ». Tu l’as scanné, et cette page s’ouvre. Tu veux poster tes vidéos du concert. Que fais-tu ?'
    choix:
      - id: connecte
        texte: 'Je veux poster mes vidéos du concert : je tape mon compte SnapTalk.'
        qualite: risque
        geste: se-connecter
        consequence: 'Internet ne marche même pas. Mais ton identifiant et ton mot de passe sont partis chez un inconnu : le QR code était un autocollant collé par-dessus le vrai. Le lendemain, ton compte SnapTalk envoie des liens d’arnaque à tes amis. Change vite ton mot de passe SnapTalk et active la double authentification.'
        reaction: 'Connexion réussie ✔ Bon festival ! 🎶'
      - id: accueil
        texte: 'Je demande le vrai Wi-Fi à l’accueil, ou je poste ce soir.'
        qualite: bon
        geste: verifier
        consequence: 'À l’accueil, on t’explique que le vrai Wi-Fi du festival demande seulement d’accepter les conditions d’utilisation. Le QR code de l’affiche était un autocollant collé par-dessus l’original. L’équipe le retire.'
        reaction: 'Plus que 1 h 59 de Wi-Fi offert ! Connecte-toi vite.'
      - id: aide
        texte: Je demande de l’aide à l’adulte qui m’accompagne avant de me connecter.
        qualite: aide
        consequence: 'Ta tante lit la page : « Un Wi-Fi n’a aucune raison de connaître ton mot de passe SnapTalk. » Vous allez demander le vrai réseau à l’accueil.'
    indices:
      - { id: mdp, libelle: 'La page demande le mot de passe de mon compte SnapTalk', passage: 'identifiant et mot de passe' }
      - { id: adresse, libelle: 'L’adresse de la page n’est pas celle de SnapTalk', passage: 'wifi-festival-basszik.net' }
    explicationIndices: 'Un Wi-Fi public peut demander d’accepter des conditions, parfois une adresse mail. Il n’a jamais besoin du mot de passe d’un de tes comptes. Même avec un bouton « se connecter avec », le mot de passe se tape uniquement sur la page du vrai réseau social, à sa vraie adresse. Ici, l’adresse de la page n’a rien à voir avec SnapTalk.'
    aRetenir: 'Un Wi-Fi public n’est pas dangereux en soi, mais son portail ne doit jamais obtenir le mot de passe d’un de tes comptes. Avant de scanner un QR code dans un lieu public, regarde s’il n’est pas collé par-dessus un autre, et demande le nom du vrai réseau à l’accueil.'
    recuperation: { action: changer-mdp, siChoix: [connecte] }
    pourquoi:
      - levier: gain
        truc: '« Wi-Fi gratuit », alors que le réseau ne passe pas : c’est exactement ce dont tu as besoin à ce moment-là.'
        parade: 'Un Wi-Fi gratuit, oui, mais sans mot de passe de compte. S’il en demande un, ce n’est pas un vrai Wi-Fi.'
      - levier: urgence
        truc: '« Plus que 2 h de Wi-Fi offert aujourd’hui ! » : tu as peur de rater l’occasion de poster pendant le concert.'
        parade: 'Tes vidéos peuvent attendre ce soir. Ton compte, lui, est difficile à récupérer.'
      - levier: autorite
        truc: 'La page affiche le nom « Festival Basszik », et le QR code est sur une affiche du festival. Tout a l’air organisé par l’équipe.'
        parade: 'Un nom et une affiche se copient facilement. Demande le nom du vrai réseau au stand d’accueil.'
      - levier: reflexe
        truc: '« Connexion rapide, sans inscription » : se connecter avec un compte qu’on a déjà paraît pratique et habituel.'
        parade: 'Avant de taper un mot de passe, regarde l’adresse de la page. Si ce n’est pas celle du service, tu t’arrêtes.'

  - type: scenario
    id: extension
    ecran:
      app: web
      appNom: Navigateur
      contact: 'Boutique d’extensions'
      messages:
        - de: contact
          texte: 'NuitNoire : passe tous les sites en mode sombre. Fini les yeux qui piquent le soir ! ★ 4,2 · 80 000 utilisateurs'
        - de: contact
          texte: 'NuitNoire demande l’autorisation de : lire et modifier toutes tes données sur tous les sites web.'
      boutons: ['Ajouter l’extension', 'Annuler']
    question: 'Tu fais tes devoirs le soir sur l’ordinateur familial, et l’écran blanc te fait mal aux yeux. Que fais-tu ?'
    choix:
      - id: ajoute
        texte: 'Elle a 80 000 utilisateurs et j’ai mal aux yeux : j’ajoute l’extension.'
        qualite: risque
        geste: installer
        consequence: 'Le mode sombre marche très bien. Trois mois plus tard, l’extension change de propriétaire et reçoit une mise à jour. Elle se met à enregistrer ce qui est tapé sur les sites, y compris des mots de passe de ta famille. Tu peux reprendre la main : supprime l’extension et demande à un adulte de changer les mots de passe importants.'
        reaction: 'NuitNoire est ajoutée ✔ Elle a maintenant accès à tous tes sites.'
      - id: reglages
        texte: 'J’essaie plutôt le mode sombre déjà prévu dans les réglages.'
        qualite: bon
        geste: regler
        consequence: 'Le navigateur et l’ordinateur ont déjà un mode sombre. Certains sites le suivent automatiquement, d’autres ont leur propre bouton de mode sombre. Tes yeux vont mieux, sans rien installer.'
        reaction: 'NuitNoire n’a pas été ajoutée.'
      - id: aide
        texte: Je demande de l’aide à un adulte, puisque c’est l’ordinateur de toute la famille.
        qualite: aide
        consequence: 'Ta belle-mère lit l’autorisation : « Toutes les données sur tous les sites, y compris ma banque ? » Elle t’aide à activer le mode sombre dans les réglages.'
    indices:
      - { id: toutes-donnees, libelle: 'L’extension peut lire et modifier tout ce que j’affiche sur tous les sites', passage: 'lire et modifier toutes tes données sur tous les sites web' }
      - { id: deja-prevu, libelle: 'Le mode sombre existe peut-être déjà dans les réglages', passage: 'mode sombre' }
    explicationIndices: 'Pour assombrir les sites, une telle extension a vraiment besoin de les modifier. C’est justement le problème : elle peut aussi lire tout ce que tu tapes, mots de passe compris. Une extension peut être revendue, puis devenir malveillante lors d’une mise à jour. Et le mode sombre existe souvent déjà dans les réglages, sans rien installer.'
    aRetenir: 'Une extension qui peut « lire et modifier toutes tes données » voit tout ce que tu fais en ligne. Installe-en le moins possible, seulement d’éditeurs de confiance, et regarde d’abord si le réglage existe déjà dans le navigateur.'
    recuperation: { action: demander-aide, siChoix: [ajoute] }
    pourquoi:
      - levier: groupe
        truc: '« 80 000 utilisateurs » : avec autant de monde, on pense que quelqu’un aurait déjà vu un problème.'
        parade: 'Le nombre d’utilisateurs ne dit pas ce que l’extension fera après sa prochaine mise à jour. Regarde ce qu’elle peut lire.'
      - levier: reflexe
        truc: '« Fini les yeux qui piquent le soir ! » : tu as mal aux yeux, la solution arrive en un clic, et on n’en lit pas plus.'
        parade: 'Avant d’ajouter une extension, lis la ligne des autorisations. « Toutes tes données sur tous les sites », c’est le maximum.'
      - levier: autorite
        truc: 'Elle est dans la « Boutique d’extensions » du navigateur, alors on la croit vérifiée. Les contrôles existent, mais ils ne voient pas tout.'
        parade: 'Même dans la boutique officielle, une extension qui peut tout lire doit venir d’un éditeur que tu connais.'

  - type: minijeu
    id: mj-permissions-college
    jeu: permissions
    config:
      consigne: Pour chaque appli, autorise seulement les permissions dont elle a vraiment besoin pour fonctionner.
      apps:
        - id: trajet-bus
          nom: TrajetBus
          description: Te guide à pied jusqu’à l’arrêt de bus le plus proche de là où tu es.
          permissions:
            - { id: position, libelle: 'Position, seulement pendant l’utilisation', necessaire: true, explication: 'Pour te guider depuis là où tu es, elle doit connaître ta position. Pendant l’utilisation, c’est suffisant.' }
            - { id: position-permanente, libelle: Position en permanence, necessaire: false, explication: 'Quand l’appli est fermée, elle n’a aucune raison de savoir où tu es.' }
            - { id: contacts, libelle: Contacts, necessaire: false, explication: 'Les horaires de bus ne dépendent pas des gens que tu connais.' }
            - { id: micro, libelle: Micro, necessaire: false, explication: 'Rien à écouter pour afficher un trajet.' }
        - id: chatcord
          nom: ChatCord
          description: Une messagerie pour discuter avec tes amis, envoyer des photos et des messages vocaux.
          permissions:
            - { id: micro, libelle: Micro, necessaire: true, explication: 'Il sert aux messages vocaux et aux appels.' }
            - { id: camera, libelle: Appareil photo, necessaire: true, explication: 'Il sert à prendre une photo pour l’envoyer.' }
            - { id: contacts, libelle: Contacts, necessaire: false, explication: 'Pratique pour retrouver tes amis, mais pas indispensable : tu peux les ajouter par pseudo. Et ton répertoire contient aussi les numéros de ta famille.' }
            - { id: position, libelle: Position précise en permanence, necessaire: false, explication: 'Discuter ne demande pas de savoir où tu es, encore moins tout le temps.' }
        - id: pas-a-pas
          nom: Pas à Pas
          description: Un podomètre qui compte tes pas de la journée.
          permissions:
            - { id: activite, libelle: Activité physique, necessaire: true, explication: 'Elle utilise les capteurs de mouvement du téléphone pour compter tes pas.' }
            - { id: position, libelle: Position précise en permanence, necessaire: false, explication: 'Compter des pas ne demande pas de savoir où tu marches.' }
            - { id: photos, libelle: Toutes tes photos et vidéos, necessaire: false, explication: 'Tes photos n’ont rien à voir avec le nombre de tes pas.' }
            - { id: contacts, libelle: Contacts, necessaire: false, explication: 'Un podomètre fonctionne très bien sans ton répertoire.' }
debrief:
  questions:
    - Quel était le piège ?
    - Quel indice pourras-tu réutiliser la prochaine fois ?
    - Que faire si ça t’est déjà arrivé ?
  reponses: 'Le piège commun : quelque chose de gratuit et pratique (une appli premium, un Wi-Fi, un mode sombre) contre un accès que tu ne donnerais jamais si on te le demandait franchement : ton mot de passe, tes données, la sécurité du téléphone. Indices réutilisables : un fichier à installer hors du magasin d’applis, un réglage de sécurité à désactiver, un portail Wi-Fi qui veut le mot de passe d’un compte, une autorisation « toutes tes données ». Si c’est déjà arrivé : supprimer l’appli ou l’extension, changer le mot de passe concerné (et partout où il est réutilisé), activer la double authentification, prévenir un adulte. Se faire avoir n’a rien de honteux : ces pièges sont conçus pour avoir l’air pratiques.'
  erreursFrequentes:
    - 'Croire qu’un Wi-Fi public est dangereux en soi, alors que le vrai danger est le portail qui réclame un mot de passe.'
    - 'Penser qu’une extension ou une appli très utilisée est forcément sûre, même après ses mises à jour.'
    - 'Croire qu’une version « premium gratuite » est simplement une version débloquée, sans rien de caché.'
fiche:
  deroulement: |
    5 min : cadre. Qui a déjà trouvé une version « gratuite » d’une appli payante, ou scanné un QR code de Wi-Fi ? (sans obligation de raconter)
    18 min : jeu, en binômes ou en classe entière vidéoprojetée.
    20 min : débrief des 3 questions, puis retour sur le mini-jeu (pourquoi les contacts ne sont pas indispensables à une messagerie).
    5 min : où trouver de l’aide (adulte de confiance, organisateurs d’un lieu public pour le vrai Wi-Fi, cybermalveillance.gouv.fr pour se faire aider).
    5 min : engagement. Cette semaine, je fais le tour des extensions de mon navigateur et des autorisations de mes applis, et je retire ce qui ne sert pas.
