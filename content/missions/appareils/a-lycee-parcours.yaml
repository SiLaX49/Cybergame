debrief:
  questions:
    - 'Qu’est-ce qui rendait ScanRapide si tentant, et comment pouvait-on vérifier ?'
    - 'Comparez les trois routes : qu’est-ce qu’on peut encore faire après une erreur ? Qui aide pour quoi ?'
    - 'Quel recours pour quelle situation : régler soi-même, le responsable ou le service informatique, ou 17Cyber ?'
  reponses: 'Les pièges de l’île : l’urgence (la file d’attente, la relève), le gain (« deux fois plus vite », « gratuit »), le groupe (Théo l’utilise, Lou ne fait jamais ses mises à jour), l’air officiel (« l’appli officielle ») et le réflexe (autoriser tout, cliquer sur la fenêtre, se connecter au premier réseau). Pour vérifier : une appli s’installe depuis sa source officielle, avec les seules autorisations utiles. Un fichier trouvé sur un forum qui réclame des identifiants peut voler les identifiants, les mots de passe et les cookies de session. Sur un appareil ou un compte de l’employeur ou du lycée, on n’installe rien soi-même : on demande au responsable ou au service informatique, et pas de nettoyage improvisé. Sur un appareil partagé, on ferme sa session. Les mises à jour font partie des réflexes de base. Wi-Fi : « Évitez les réseaux Wi-Fi publics ou inconnus » ; on préfère ses données mobiles pour les opérations sensibles, sans croire pour autant que quelqu’un lit tout sur un réseau public. Aucun outil, pas même un VPN, ne protège de tout. Trois routes : vérifier soi-même, demander à la bonne personne (le service informatique pour l’appareil et les comptes du festival, la responsable, un parent), ou réparer après avoir installé l’outil. Réparer, dans l’ordre : ne plus saisir de secrets sur l’appareil (et prévenir le responsable si un compte de l’employeur est touché), sécuriser ses comptes depuis un appareil sain, la messagerie d’abord, puis faire examiner l’appareil. Désinstaller ne suffit pas : les données déjà volées sont parties. 17Cyber fait un diagnostic et oriente ; ce n’est ni un numéro de téléphone ni une plainte automatique.'
  erreursFrequentes:
    - 'Installer un outil trouvé sur un forum parce qu’il promet d’aller plus vite, ou accepter toutes les autorisations d’une appli officielle.'
    - 'Changer ses mots de passe depuis l’appareil suspect, ou croire que désinstaller l’outil règle tout.'
    - 'Se connecter à un compte sur un Wi-Fi public ou inconnu, ou laisser sa session ouverte sur un appareil partagé.'
fiche:
  deroulement: |
    5 min : cadre. Qui a déjà installé une appli ou un outil conseillé par quelqu’un, sans regarder d’où il venait ? Qui a déjà travaillé sur un appareil partagé ? (sans obligation de répondre)
    25 min : traversée de l’île, en binômes ou en classe entière vidéoprojetée. À l’outil ScanRapide, trois routes : vérifier soi-même, demander au service informatique du festival, ou installer l’outil puis réparer. Si plusieurs binômes jouent, répartir les trois routes.
    10 min : débrief. Comparez les trois routes : qu’est-ce qu’on peut encore faire après une erreur ? Qui aide pour quoi ? Puis retour sur le tri « le bon recours ».
    5 min : où trouver de l’aide (tuteur ou service informatique pour les appareils d’un stage ou d’un job, référent ou service informatique du lycée pour ses appareils, parents, 17cyber.gouv.fr pour un diagnostic). Aucun VPN ni outil n’est recommandé dans le jeu.
    5 min : engagement. Cette semaine, je relis les autorisations d’une appli de mon téléphone et je retire celles qui ne servent pas.
