id: a-6e-lampe-torche
theme: appareils
tranches: ['6e']
titre: La lampe trop curieuse
resume: 'Une lampe torche qui veut tes contacts, une mise à jour qui attend depuis des semaines, un jeu « gratuit » à installer par un lien : ton téléphone mérite que tu ralentisses.'
duree: 15
objectifs:
  - Vérifier ce qu’une appli demande avant de l’installer
  - Comprendre pourquoi on fait les mises à jour
  - Installer ses applis seulement depuis le magasin d’applis du téléphone
competences:
  crcn: ['4.1', '4.2']
  programmes: ['EMI cycle 3']
etapes:
  - type: scenario
    id: lampe-contacts
    ecran:
      app: web
      appNom: Magasin d’applis
      contact: 'Super Lampe'
      messages:
        - de: contact
          texte: 'Super Lampe : la lampe torche la plus puissante ! Gratuit · ★ 4,6 · 1 million de téléchargements'
          texteSimple: 'Super Lampe : la lampe torche la plus puissante ! Gratuite, 1 million de téléchargements.'
        - de: contact
          texte: 'Super Lampe demande l’accès à : tes contacts, ta position, ton micro. [Tout autoriser] [Refuser]'
          texteSimple: 'Super Lampe veut voir tes contacts, ta position et ton micro. [Tout autoriser] [Refuser]'
    question: Tu veux une lampe pour retrouver tes affaires dans le noir. Que fais-tu ?
    choix:
      - id: tout-autoriser
        texte: 'Un million de gens l’ont, et je veux juste ma lampe : j’appuie sur « Tout autoriser ».'
        qualite: risque
        geste: regler
        consequence: 'La lampe marche bien. Mais l’appli envoie la liste de tes contacts à une entreprise de publicité. Bientôt, des amis à toi reçoivent des SMS de pub bizarres. Tu peux limiter les dégâts : avec un adulte, supprime l’appli. Elle ne prendra plus rien. Dis à tes amis de ne pas répondre.'
        consequenceSimple: 'L’appli a copié tes contacts. Tes amis reçoivent des pubs bizarres. Avec un adulte, supprime l’appli : elle ne prendra plus rien.'
      - id: lampe-telephone
        texte: 'Une lampe n’a pas besoin de mes contacts : je refuse, et j’utilise la lampe déjà prévue dans mon téléphone.'
        qualite: bon
        geste: fermer
        consequence: 'Ton téléphone a déjà une lampe dans ses réglages rapides. Elle éclaire très bien et ne demande rien.'
      - id: aide
        texte: Je demande de l’aide à un adulte avant d’installer l’appli.
        qualite: aide
        consequence: 'Ton père regarde la liste : « Une lampe qui veut tes contacts ? Non merci. » Il te montre la lampe déjà dans ton téléphone.'
    indices:
      - { id: contacts, libelle: 'Une lampe demande mes contacts et mon micro', pertinent: true }
      - { id: position, libelle: 'Elle veut aussi savoir où je suis', pertinent: true }
      - { id: tout-autoriser, libelle: 'Le bouton propose de tout autoriser d’un coup', pertinent: true }
      - { id: note, libelle: 'L’appli a une note de 4,6 étoiles', pertinent: false }
    explicationIndices: 'Une lampe a seulement besoin d’allumer le flash. Tes contacts, ta position et ton micro ne lui servent à rien. Certaines applis gratuites gagnent de l’argent en revendant ces informations. La bonne note, elle, ne dit rien sur ce que l’appli fait de tes données.'
    aRetenir: 'Avant d’installer une appli, regarde ce qu’elle demande. Si une autorisation n’a rien à voir avec ce que fait l’appli, refuse-la ou choisis une autre appli.'
    aRetenirSimple: 'Une appli doit demander seulement ce dont elle a besoin. Sinon, tu refuses.'
    recuperation: { action: demander-aide, siChoix: [tout-autoriser] }
    pourquoi:
      - levier: groupe
        truc: '« 1 million de téléchargements » : on se dit que si tout le monde l’a, elle est sûre. Ça ne dit rien de ce qu’elle fait de tes contacts.'
        parade: 'Ne regarde pas seulement le nombre de téléchargements. Regarde surtout ce que l’appli demande.'
      - levier: reflexe
        truc: 'Le bouton « Tout autoriser » va plus vite que lire la liste. On appuie sans regarder ce qu’on accepte.'
        parade: 'Lis la liste avant d’appuyer. Tu peux refuser une autorisation, puis supprimer l’appli si elle ne marche pas sans.'
      - levier: gain
        truc: 'Elle est gratuite et promet d’être « la plus puissante ». Mais une appli gratuite peut se payer avec tes informations.'
        parade: 'Demande-toi comment l’appli gagne de l’argent. Parfois, ce sont tes données qui paient.'

  - type: scenario
    id: mise-a-jour
    ecran:
      app: sms
      appNom: Notifications
      contact: 'Réglages du téléphone'
      messages:
        - de: contact
          texte: 'Mise à jour disponible. Elle corrige des failles de sécurité. [Installer cette nuit] [Plus tard]'
          texteSimple: 'Mise à jour disponible. Elle répare des failles de sécurité. [Installer cette nuit] [Plus tard]'
          heure: '07:30'
        - de: contact
          texte: 'Rappel : cette mise à jour attend depuis 5 semaines.'
          texteSimple: 'Rappel : elle attend depuis 5 semaines.'
          heure: '17:45'
    question: Tu es en pleine partie, et ton téléphone te rappelle encore cette mise à jour. Que fais-tu ?
    choix:
      - id: plus-tard
        texte: 'Je suis en pleine partie et mon téléphone marche très bien : j’appuie encore sur « Plus tard ».'
        qualite: risque
        geste: ignorer
        consequence: 'Ton téléphone marche, mais la faille reste ouverte. Quand une faille est réparée, les pirates l’apprennent aussi. Ils visent alors les téléphones pas à jour. Un jour, un site piégé en profite pour remplir ton écran de pubs. La mise à jour l’aurait bloqué. Tu peux encore la faire ce soir.'
        consequenceSimple: 'La faille reste ouverte. Un site piégé en profite pour mettre des pubs partout. Tu peux encore faire la mise à jour ce soir.'
      - id: cette-nuit
        texte: 'Je finis ma partie, puis je choisis « Installer cette nuit », téléphone branché.'
        qualite: bon
        geste: installer
        consequence: 'Au réveil, ton téléphone est à jour. Tes photos et tes jeux sont toujours là. Les failles sont réparées.'
      - id: aide
        texte: Je demande de l’aide à un adulte pour faire la mise à jour sans rien perdre.
        qualite: aide
        consequence: 'Ta mère vérifie avec toi qu’il reste de la place et que tes photos sont sauvegardées. Le soir, vous lancez la mise à jour.'
    indices:
      - { id: failles, libelle: 'La notification parle de failles de sécurité', pertinent: true }
      - { id: semaines, libelle: 'La mise à jour attend depuis 5 semaines', pertinent: true }
      - { id: reglages, libelle: 'Elle vient des réglages du téléphone, pas d’un site', pertinent: true }
      - { id: marche, libelle: 'Mon téléphone marche bien en ce moment', pertinent: false }
    explicationIndices: 'Une faille, c’est un trou dans la protection du téléphone. Une mise à jour répare des failles que les pirates connaissent déjà. Plus on attend, plus le téléphone reste exposé. Un téléphone qui marche bien n’est pas forcément protégé. Une vraie mise à jour s’affiche dans les réglages du téléphone, jamais dans une pub sur un site.'
    aRetenir: 'Les mises à jour corrigent des failles de sécurité. Fais-les vite, par exemple la nuit, téléphone branché. Une vraie mise à jour vient des réglages du téléphone, jamais d’une pub sur un site.'
    aRetenirSimple: 'Les mises à jour réparent les failles. Fais-les vite, par exemple la nuit.'
    recuperation: { action: demander-aide, siChoix: [plus-tard] }
    pourquoi:
      - levier: reflexe
        truc: 'Appuyer sur « Plus tard » est devenu une habitude. On le fait sans même lire la notification.'
        parade: 'Choisis l’installation la nuit : la mise à jour se fait pendant que tu dors.'
      - levier: peur
        truc: 'On a peur que la mise à jour efface des photos ou bloque le téléphone au mauvais moment.'
        parade: 'Une mise à jour n’efface pas tes photos en temps normal. Pour être tranquille, sauvegarde-les avant avec un adulte.'
      - levier: groupe
        truc: 'Beaucoup de gens repoussent leurs mises à jour. Comme rien ne leur arrive, on croit que c’est sans risque.'
        parade: 'Les pirates visent justement les téléphones pas à jour. Que d’autres attendent ne te protège pas.'

  - type: scenario
    id: jeu-hors-store
    ecran:
      app: chat
      appNom: ChatCord
      contact: 'Malik'
      messages:
        - de: contact
          texte: 'Trop bien ce jeu, Dino Galop ! Dans le magasin d’applis, il coûte 4,99 €. Mais là, il est gratuit 😎'
          texteSimple: 'Le jeu Dino Galop coûte 4,99 € dans le magasin d’applis. Mais là, il est gratuit 😎'
          heure: '18:40'
        - de: contact
          texte: 'Télécharge-le ici : dinogalop-gratuit.net. Ton téléphone va dire « source inconnue », tu acceptes, c’est normal.'
          texteSimple: 'Télécharge-le sur dinogalop-gratuit.net. Le téléphone dira « source inconnue ». Accepte, c’est normal.'
          heure: '18:41'
    question: Malik est dans ta classe. Il a installé le jeu et dit qu’il marche très bien. Que fais-tu ?
    choix:
      - id: installe
        texte: 'Malik l’a installé et il n’a aucun souci : je télécharge le jeu et j’accepte.'
        qualite: risque
        geste: telecharger
        consequence: 'Le jeu se lance, mais il cache autre chose. Il te demande ton compte ChatCord « pour sauvegarder ta partie ». Le soir, ton compte envoie le même lien à tous tes amis. Tu peux reprendre la main : change ton mot de passe et supprime le jeu avec un adulte.'
        consequenceSimple: 'Le faux jeu a volé ton mot de passe ChatCord. Ton compte envoie le lien à tes amis. Change vite ton mot de passe.'
      - id: magasin
        texte: 'Je reste dans le magasin d’applis et j’y cherche un jeu gratuit.'
        qualite: bon
        geste: ignorer
        consequence: 'Tu trouves un jeu de dinosaures gratuit dans le magasin d’applis. Tu préviens Malik que son lien pourrait être piégé.'
      - id: aide
        texte: Je demande de l’aide à un adulte avant de télécharger, même si Malik dit que tout va bien.
        qualite: aide
        consequence: 'Ta grande sœur t’explique : « En dehors du magasin d’applis, personne ne vérifie le jeu. » Vous prévenez Malik ensemble.'
    indices:
      - { id: hors-magasin, libelle: 'Le jeu se télécharge en dehors du magasin d’applis', pertinent: true }
      - { id: payant-gratuit, libelle: 'Un jeu payant devient gratuit, sans raison', pertinent: true }
      - { id: source-inconnue, libelle: 'On me dit d’accepter l’alerte du téléphone', pertinent: true }
      - { id: copain, libelle: 'Le lien vient de Malik, un copain de classe', pertinent: false }
    explicationIndices: 'Le magasin d’applis vérifie les applis avant de les proposer. Un fichier pris ailleurs n’est vérifié par personne. Un jeu payant offert gratuitement cache souvent un piège. Malik est sincère, mais lui aussi a pu se faire avoir.'
    aRetenir: 'Installe tes applis seulement depuis le magasin d’applis du téléphone. Il les vérifie : ce n’est pas parfait, mais c’est bien plus sûr. Si ton téléphone affiche « source inconnue », arrête-toi.'
    aRetenirSimple: 'Installe tes jeux seulement depuis le magasin d’applis. Le téléphone dit « source inconnue » ? Tu t’arrêtes.'
    recuperation: { action: changer-mdp, siChoix: [installe] }
    pourquoi:
      - levier: gain
        truc: 'Le jeu coûte 4,99 € dans le magasin d’applis, et là « il est gratuit ». C’est ce cadeau qui donne envie de cliquer.'
        parade: 'Un jeu payant offert hors du magasin d’applis, c’est souvent un piège. Cherche plutôt un jeu gratuit dans le magasin.'
      - levier: confiance
        truc: 'Le lien vient de Malik, ton copain. Il est sincère, mais il ne sait pas ce que cache le fichier.'
        parade: 'Même quand un ami l’envoie, un jeu hors du magasin d’applis reste risqué. Dis-le-lui gentiment.'
      - levier: reflexe
        truc: 'Le message dit que l’alerte « source inconnue », « c’est normal ». En fait, c’est ton téléphone qui essaie de te protéger.'
        parade: 'Quand ton téléphone t’avertit, écoute-le. Ferme la page et parles-en à un adulte.'

  - type: minijeu
    id: mj-permissions-6e
    jeu: permissions
    config:
      consigne: Pour chaque appli, autorise seulement ce dont elle a vraiment besoin.
      apps:
        - id: super-lampe
          nom: Super Lampe
          description: Une lampe torche qui allume le flash du téléphone.
          permissions:
            - { id: flash, libelle: 'Lampe de poche (flash)', necessaire: true, explication: 'C’est le seul besoin d’une lampe torche.' }
            - { id: contacts, libelle: Contacts, necessaire: false, explication: 'Une lampe n’a pas besoin de savoir qui tu connais.' }
            - { id: position, libelle: Position, necessaire: false, explication: 'Pour éclairer, pas besoin de savoir où tu es.' }
            - { id: micro, libelle: Micro, necessaire: false, explication: 'Une lampe n’a rien à écouter.' }
        - id: chapeau-clic
          nom: ChapeauClic
          description: Une appli pour prendre des photos et ajouter des chapeaux rigolos.
          permissions:
            - { id: camera, libelle: Appareil photo, necessaire: true, explication: 'Il faut l’appareil photo pour prendre la photo.' }
            - { id: enregistrer, libelle: 'Enregistrer dans tes photos', necessaire: true, explication: 'Elle en a besoin pour garder tes photos rigolotes sur le téléphone.' }
            - { id: contacts, libelle: Contacts, necessaire: false, explication: 'Ajouter un chapeau ne demande pas la liste de tes contacts.' }
            - { id: position, libelle: Position précise, necessaire: false, explication: 'Un chapeau rigolo n’a pas besoin de savoir où tu habites.' }
debrief:
  questions:
    - Quel était le piège ?
    - Quel indice pourras-tu réutiliser la prochaine fois ?
    - Que faire si ça t’est déjà arrivé ?
  reponses: 'Le piège commun : aller vite (« Tout autoriser », « Plus tard », « accepte, c’est normal ») sans regarder ce que ça change pour le téléphone. Indices réutilisables : une appli qui demande des choses sans rapport avec ce qu’elle fait, une mise à jour qui attend depuis longtemps, un jeu à installer en dehors du magasin d’applis, l’alerte « source inconnue ». Si c’est déjà arrivé : en parler à un adulte, supprimer l’appli, retirer les autorisations dans les réglages, faire la mise à jour et changer le mot de passe du compte concerné. Ce n’est pas grave d’avoir appuyé trop vite : on peut presque toujours réparer.'
  erreursFrequentes:
    - 'Croire qu’une appli très téléchargée ou bien notée ne peut rien faire de mal avec tes données.'
    - 'Penser qu’un téléphone qui marche bien n’a pas besoin de mise à jour.'
    - 'Croire qu’un jeu envoyé par un ami est forcément sûr, même hors du magasin d’applis.'
fiche:
  deroulement: |
    5 min : cadre. Qui a déjà vu son téléphone demander « Autoriser l’accès à… » ? (sans obligation de raconter)
    15 min : jeu, en binômes ou en classe entière vidéoprojetée.
    20 min : débrief des 3 questions, puis retour sur le mini-jeu (pourquoi la lampe n’a besoin que du flash).
    5 min : où trouver de l’aide (adulte de confiance, réglages du téléphone avec un parent, cybermalveillance.gouv.fr pour les parents).
    5 min : engagement. Ce soir, je regarde avec un adulte si mon téléphone a une mise à jour en attente.
