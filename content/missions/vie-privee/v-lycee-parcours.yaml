debrief:
  questions:
    - 'Pourquoi avait-on envie de publier la photo d’équipe tout de suite, et qu’est-ce qu’il fallait faire avant ?'
    - 'Comparez les trois routes : qu’est-ce qu’on peut encore faire après une erreur ? Qui aide pour quoi ?'
    - 'Qu’est-ce que je peux retirer ou régler moi-même, et qu’est-ce que je dois demander à quelqu’un d’autre ?'
  reponses: 'Les pièges de l’île : le réflexe (publier, valider ce qui est proposé), la confiance (« ils ont posé », « c’est la famille », « mes amis »), le groupe (deux sur trois sont d’accord, tout le monde partage sa position) et l’air officiel (le patron, la page de l’entreprise). Le repère : « Pouvoir prendre ou recevoir une photo ne signifie pas que tu peux la publier librement. » Chacun a droit au respect de sa vie privée (Code civil, article 9) : sur une photo de groupe, on demande l’accord de chacun, et l’accord d’une personne ne vaut que pour elle. On limite ce qu’on transmet (un CV allégé, envoyé à la bonne personne ; un prénom plutôt que son nom et son lycée) et on choisit qui voit sa position, et combien de temps. Trois routes : régler soi-même qui voit quoi, demander à la bonne personne (tuteur, parent, CPE ou professeur qui suit la PFMP), ou réparer après avoir publié. Réparer, dans l’ordre : garder la trace des copies (où, quand, par qui), retirer sa publication, demander le retrait des copies à leur auteur puis à la plateforme, prévenir les personnes, et régler son audience. Supprimer son compte ne fait pas disparaître les copies, et on ne peut pas promettre qu’une copie déjà diffusée disparaîtra partout. Si ça persiste, effacement, retrait d’image, déréférencement et plainte sont des démarches différentes : on se fait aider pour choisir.'
  erreursFrequentes:
    - 'Croire qu’une personne qui a posé, ou qui a reçu la photo, est d’accord pour qu’elle soit publiée.'
    - 'Penser que supprimer sa publication ou son compte fait disparaître toutes les copies.'
    - 'Laisser les réglages proposés (lien public, « tous mes amis », sans limite de durée) sans les regarder.'
fiche:
  deroulement: |
    5 min : cadre. Qui a déjà vu une photo de lui ou d’elle publiée sans qu’on lui demande ? Qui a déjà partagé sa position pour retrouver quelqu’un ? (sans obligation de répondre)
    25 min : traversée de l’île, en binômes ou en classe entière vidéoprojetée. À la photo d’équipe, trois routes : régler soi-même qui voit quoi, demander au tuteur, ou publier sans demander puis réparer. Si plusieurs binômes jouent, répartir les trois routes.
    10 min : débrief. Comparez les trois routes : qu’est-ce qu’on peut encore faire après une erreur ? Qui aide pour quoi ? Puis retour sur le tri « le bon recours ».
    5 min : où trouver de l’aide (tuteur et professeur qui suit la PFMP, CPE, parents). Rappeler qu’on ne peut pas promettre qu’une copie déjà diffusée disparaîtra partout.
    5 min : engagement. Cette semaine, je regarde l’audience par défaut de mes publications et de ma position, et je la règle moi-même.
relecture:
  statut: a-relire
