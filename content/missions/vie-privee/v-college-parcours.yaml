id: v-college-parcours
theme: vie-privee
format: parcours
tranches: ['5e-3e']
titre: La traversée de l’île aux secrets
resume: 'Une story qui dit où est la fête, une photo où l’on t’identifie sans te demander, une vidéo qui fait rire tout le monde sauf un : traverse l’île en gardant la main sur ton image et sur celle des autres.'
duree: 20
objectifs:
  - Repérer ce qu’une story ou un lien partagé révèle (adresse, lieu, visages)
  - Faire respecter son droit à l’image et respecter celui des autres
  - Choisir qui peut m’identifier et faire retirer une photo publiée sans accord
competences:
  crcn: ['4.2', '2.2', '2.4']
  programmes: ['EMI cycle 4']
etapes:
  - type: lieu
    id: story-bus
    lieu: Le bus
    decor: bus
    guide: 'Samedi, 15 h, dans le bus pour l’anniversaire de Jade. Tu filmes ton paquet cadeau pour une story SnapTalk. L’appli te propose un sticker de lieu déjà rempli : « 📍 14 allée des Tilleuls ». C’est l’adresse de Jade. Ta story est visible par tes 380 abonnés, dont beaucoup que tu ne connais pas en vrai. Lina, à côté de toi, regarde ton écran : « Mets le lieu, ça fait plus stylé ! »'
    question: Ta story est prête. Que fais-tu ?
    choix:
      - id: sticker
        texte: 'Je publie avec le sticker de lieu, pour que ça fasse plus stylé.'
        qualite: risque
        reaction: 'Ta story montre à 380 personnes l’adresse de Jade et le jour de la fête. Le soir, deux garçons que personne ne connaît sonnent à la porte : « On a vu la story. » La mère de Jade les renvoie, mais l’ambiance retombe d’un coup. Ce sticker proposé par l’appli, beaucoup le laissent sans y penser. Tu peux encore le retirer de ta story.'
      - id: sans-lieu
        texte: 'J’enlève le sticker et je publie mon cadeau sans dire où on va.'
        qualite: bon
        reaction: 'Ta story montre juste le paquet et un « Ce soir 🎉 ». Les invités ont l’adresse dans le groupe de la fête, et personne d’autre ne la voit.'
      - id: aide
        texte: 'Je demande de l’aide à ma grande sœur, assise à côté, avant de publier.'
        qualite: aide
        reaction: 'Ta sœur jette un œil : « C’est l’adresse de Jade, pas la tienne. Elle la donne à qui elle veut. » Elle te montre comment enlever le sticker avant de publier.'
    pourquoi:
      - levier: groupe
        truc: '« Mets le lieu, ça fait plus stylé ! » Lina le fait, et plein de stories affichent un lieu.'
        parade: 'Que d’autres affichent un lieu ne protège personne. Ici, c’est la maison de Jade que tu montrerais.'
      - levier: reflexe
        truc: 'Le sticker est proposé déjà rempli. Il suffit de ne rien toucher pour le publier.'
        parade: 'Avant de publier une story, regarde chaque sticker : lieu, heure, personnes identifiées.'
      - levier: autorite
        truc: 'C’est l’appli qui propose le lieu. On croit que c’est un réglage normal.'
        parade: 'Une appli pousse à partager le plus possible. C’est toi qui décides ce qui sort.'
    aRetenir: 'L’adresse d’un ami fait partie de sa vie privée : elle ne se publie pas sans son accord. Avant de publier une story, regarde les stickers de lieu et qui va la voir.'

  - type: lieu
    id: photo-identifiee
    lieu: La fête
    decor: fete
    guide: 'À la fête, tout le monde danse et prend des photos. Vers 20 h, ton téléphone vibre : « Malo t’a identifié·e sur une photo ». On t’y voit la bouche pleine de gâteau, en pleine grimace. Malo l’a publiée en public, avec le lieu « chez Jade ». Elle a déjà 60 likes et des commentaires « 😂😂 ». Malo t’écrit : « Trop drôle cette photo, nan ? »'
    question: Cette photo te gêne. Que fais-tu ?
    choix:
      - id: laisse
        texte: 'Je réponds « grave 😂 » pour ne pas casser l’ambiance de la fête.'
        qualite: risque
        reaction: 'La photo reste en public, avec ton nom dessus. Lundi, des élèves d’autres classes la repartagent et t’appellent « Gâteau ». Beaucoup se taisent pour ne pas passer pour le rabat-joie de la soirée. Il n’est pas trop tard pour en parler : une photo peut toujours être retirée.'
      - id: ecrit-malo
        texte: 'J’écris à Malo en privé pour qu’il retire la photo et mon nom.'
        qualite: bon
        suite: reglages
        reaction: 'Malo répond : « Ah, désolé, je pensais que ça te faisait rire. » Il retire la photo dans la minute. Tu as dit simplement ce qui te gênait, et ça a suffi.'
      - id: aide
        texte: 'Je demande de l’aide à la mère de Jade, qui prépare les crêpes à côté.'
        qualite: aide
        suite: cuisine
        reaction: 'La mère de Jade t’écoute sans rire : « Tu as le droit de ne pas vouloir être en ligne. On va régler ça calmement. » Elle t’emmène dans la cuisine.'
    pourquoi:
      - levier: groupe
        truc: 'La photo a déjà 60 likes et des « 😂😂 ». Tout le monde a l’air de trouver ça normal.'
        parade: 'Des likes ne valent pas ton accord. C’est ton image : c’est toi qui décides.'
      - levier: humour
        truc: '« Trop drôle cette photo, nan ? » Malo présente ça comme une blague entre amis.'
        parade: 'Une blague qui ne fait pas rire la personne sur la photo n’est plus une blague.'
      - levier: peur
        truc: 'Tu as peur de casser l’ambiance de la fête et de passer pour celui ou celle qui ne rigole pas.'
        parade: 'Demander le retrait en privé ne gâche rien. Un vrai ami comprend.'
      - levier: confiance
        truc: 'Malo est ton ami. Il ne voulait pas te faire de mal, alors tu n’oses pas lui dire.'
        parade: 'Justement : c’est un ami, il peut entendre que ça te gêne. Dis-le-lui simplement.'
    aRetenir: 'Ton image t’appartient : personne ne doit publier ta photo ni t’identifier sans ton accord. Tu as le droit de demander qu’on la retire, toi-même ou avec l’aide d’un adulte.'

  - type: lieu
    id: reglages
    lieu: Ta chambre
    decor: chambre
    guide: 'Le soir, dans ta chambre, tu ouvres les réglages de SnapTalk pour que ça ne recommence pas. « Qui peut t’identifier : Tout le monde ». « Photos où tu es identifié·e : ajoutées à ton profil automatiquement ». Une bulle s’affiche : « Active les suggestions de visage : tes amis t’identifieront en un clic ! »'
    question: Que règles-tu ?
    choix:
      - id: suggestions
        texte: 'J’active les suggestions : comme ça, je verrai toutes les photos de moi.'
        qualite: risque
        reaction: 'Tes amis t’identifient maintenant en un clic, et ces photos arrivent seules sur ton profil, même celles où tu n’es pas à ton avantage. L’appli reconnaît ton visage partout. Cette bulle avait l’air pratique, elle est faite pour ça. Tu peux revenir dans les réglages et tout couper.'
      - id: valider
        texte: 'Je choisis « Mes amis » et je valide chaque photo avant qu’elle s’affiche.'
        qualite: bon
        reaction: 'Désormais, seuls tes amis peuvent t’identifier, et rien n’arrive sur ton profil sans ton accord. Tu laisses aussi les suggestions de visage éteintes.'
      - id: aide
        texte: 'Je demande de l’aide à ma mère pour comprendre ces réglages et les choisir.'
        qualite: aide
        reaction: 'Ta mère lit chaque réglage avec toi. Vous choisissez « Mes amis » et la validation avant affichage, et vous laissez les suggestions de visage éteintes.'
    pourquoi:
      - levier: gain
        truc: '« Tes amis t’identifieront en un clic ! » L’appli te promet de ne rater aucune photo de toi.'
        parade: 'Un clic pour t’identifier, c’est aussi un clic pour te montrer partout. Garde la main.'
      - levier: reflexe
        truc: 'Une bulle s’affiche, et on appuie sur le gros bouton pour la faire disparaître.'
        parade: 'Lis chaque bulle qui parle de ton visage ou de tes photos avant de toucher.'
      - levier: autorite
        truc: '« Tout le monde » est réglé par défaut. On croit que l’appli a choisi pour notre bien.'
        parade: 'Les réglages par défaut servent l’appli. Règle-les toi-même, une fois pour toutes.'
    aRetenir: 'Dans les réglages, tu choisis qui peut t’identifier et ce qui s’affiche sur ton profil. Valider chaque identification te laisse le dernier mot sur ton image.'

  - type: lieu
    id: video-cour
    lieu: La cour
    decor: cour
    suite: album
    guide: 'Lundi, dans la cour, tout le monde parle de la fête. Tu as monté une vidéo des moments les plus drôles : Sacha qui tombe de sa chaise, Jade qui rate ses bougies, Lina qui chante faux. Tes potes insistent : « Poste-la en public, elle va exploser ! »'
    question: Ta vidéo est prête. Que fais-tu ?
    choix:
      - id: poste
        texte: 'Je la publie pour tout le monde : sur le moment, ils riaient tous.'
        qualite: risque
        reaction: 'La vidéo fait 2 000 vues en une journée. Sacha, lui, ne rit pas : sa chute tourne dans tout le collège et il te demande de l’enlever. Samedi, c’est toi qui demandais à Malo de retirer une photo. Tu peux encore retirer la vidéo et t’excuser.'
      - id: accord
        texte: 'J’envoie d’abord la vidéo à Sacha, Jade et Lina pour savoir s’ils sont d’accord.'
        qualite: bon
        reaction: 'Jade et Lina disent oui. Sacha préfère qu’on coupe sa chute. Tu enlèves le passage, et la vidéo part dans le groupe de la fête, pas en public.'
      - id: aide
        texte: 'Je demande de l’aide à la CPE pour savoir ce que j’ai le droit de poster.'
        qualite: aide
        reaction: 'La CPE t’explique : chaque personne filmée doit être d’accord avant une publication. Tu poses la question à tes amis, et Sacha préfère qu’on coupe sa chute.'
    pourquoi:
      - levier: groupe
        truc: '« Poste-la en public, elle va exploser ! » Tes potes attendent la vidéo.'
        parade: 'Tes potes ne sont pas sur la vidéo. Ceux qui y sont ont leur mot à dire.'
      - levier: humour
        truc: 'Tout le monde a ri à la fête. On croit que ça fera encore rire en ligne.'
        parade: 'Rire entre amis n’est pas accepter d’être vu par tout le collège. Demande avant.'
      - levier: gain
        truc: '« Elle va exploser » : tu imagines déjà les vues et les commentaires.'
        parade: 'Des vues ne valent pas un ami blessé. Une vidéo publiée échappe vite à ton contrôle.'
    aRetenir: 'Avant de publier une photo ou une vidéo, chaque personne qu’on y voit doit être d’accord. Ce qui fait rire sur le moment peut blesser une fois en ligne, devant tout le collège.'
    recuperation: { action: retirer-publication, siChoix: [poste] }

  - type: lieu
    id: cuisine
    lieu: La cuisine
    decor: cuisine
    guide: 'Dans la cuisine de Jade, sa mère regarde la photo avec toi. Pendant ce temps, les commentaires continuent : « 😂 on dirait un hamster ». Tu as très envie de répondre sous la photo, devant tout le monde. La mère de Jade propose : « Je vais chercher Malo. On lui en parle tous les deux, au calme. »'
    question: Que fais-tu ?
    choix:
      - id: commente
        texte: 'Je réponds sous la photo pour remettre à sa place celui qui se moque.'
        qualite: risque
        reaction: 'Ton commentaire énervé fait remonter la photo chez tout le monde, et les moqueries repartent de plus belle. Répondre à chaud, c’est tentant quand on est vexé·e. Tu peux supprimer ton commentaire, puis parler à Malo au calme.'
      - id: parle
        texte: 'J’attends Malo avec elle et je lui explique au calme ce qui me gêne.'
        qualite: bon
        reaction: 'Malo arrive, un peu gêné : « Je pensais que ça te faisait rire. » Il retire la photo et ton identification devant vous. La mère de Jade lui rappelle qu’on demande toujours avant de publier quelqu’un.'
      - id: aide
        texte: 'Je demande de l’aide à Jade aussi : c’est sa fête, et Malo l’écoute.'
        qualite: aide
        reaction: 'Jade vous rejoint. À trois, vous expliquez à Malo ce qui te gêne. Il retire la photo et ton identification, et il s’excuse.'
    pourquoi:
      - levier: colere
        truc: '« 😂 on dirait un hamster » : la moquerie pique, et tu veux répondre tout de suite.'
        parade: 'Une réponse énervée en public attire encore plus de regards. Garde ta réponse pour Malo, en privé.'
      - levier: reflexe
        truc: 'Le bouton « Répondre » est juste là, sous la photo. Écrire prend deux secondes.'
        parade: 'Avant de répondre sous une publication qui te blesse, pose ton téléphone une minute.'
      - levier: honte
        truc: 'Tu as honte de cette photo, et tu veux montrer que tu n’es pas la cible.'
        parade: 'Ce n’est pas à toi d’avoir honte. Faire retirer la photo règle le problème à la source.'
    aRetenir: 'Face à une photo gênante, répondre à chaud en public attire encore plus de regards. Demander le retrait au calme, seul·e ou avec un adulte, fait disparaître la photo.'

  - type: lieu
    id: compte-ragots
    lieu: Le salon
    decor: salon
    guide: 'Dimanche, dans le salon, tu racontes la fête à ton père. Malo a bien retiré la photo, mais un compte inconnu, « ragots.college.ville », l’avait déjà copiée. Il l’a remise dans une story avec la légende « La reine du gâteau 🎂 ». Ce compte publie les photos de plein d’élèves. Ton père dit : « Pas de panique, on s’en occupe ensemble. »'
    question: La photo circule encore sur ce compte. Que fais-tu ?
    choix:
      - id: laisse-tomber
        texte: 'Je laisse tomber : tout le monde l’a vue, c’est trop tard de toute façon.'
        qualite: risque
        reaction: 'Le compte garde la photo et en publie d’autres, d’autres élèves. Tu avais envie que tout le monde oublie : c’est humain. Mais il n’est jamais trop tard pour signaler une photo publiée sans accord. Bloque et signale ce compte, ton père t’aide pour la suite.'
      - id: signale
        texte: 'Je fais une capture, puis je signale la story à SnapTalk avec mon père.'
        qualite: bon
        reaction: 'Ton père t’explique : publier ta photo sans ton accord porte atteinte à ton droit à l’image. Vous signalez la story pour ce motif. Si la plateforme ne la retire pas, il pourra porter plainte auprès de la CNIL ou appeler le 3018.'
      - id: aide
        texte: 'Je demande de l’aide au 3018 avec mon père, pour faire retirer la photo.'
        qualite: aide
        reaction: 'Ton père appelle le 3018, gratuit et anonyme. La conseillère vous explique comment signaler la story, et elle peut demander elle-même son retrait à la plateforme. Deux jours plus tard, la photo a disparu.'
    pourquoi:
      - levier: honte
        truc: '« La reine du gâteau 🎂 » : la légende te met mal à l’aise, et tu voudrais que personne n’en parle plus.'
        parade: 'Ce n’est pas à toi d’avoir honte. Signaler, c’est ce qui fait disparaître la photo.'
      - levier: groupe
        truc: 'Ce compte publie les photos de plein d’élèves. Ça finit par sembler banal.'
        parade: 'Que beaucoup soient visés ne rend pas ça normal. Chaque signalement compte.'
      - levier: peur
        truc: 'Signaler, c’est risquer que le compte s’en prenne à toi, pense-t-on.'
        parade: 'Un signalement est anonyme : le compte ne sait pas qui l’a fait.'
    aRetenir: 'Une photo de toi publiée sans ton accord peut être signalée à la plateforme, même quand elle a été copiée. Si elle reste en ligne, un adulte peut saisir la CNIL ou appeler le 3018.'
    recuperation: { action: bloquer-signaler, siChoix: [laisse-tomber] }

  - type: lieu
    id: album
    lieu: Le parc
    decor: parc
    guide: 'Une semaine plus tard, au parc, Jade veut rassembler les photos de la fête. Elle crée un album partagé sur SnapTalk. Lina propose : « Mets “Toute personne avec le lien”, comme ça tout le monde pourra ajouter ses photos ! » Jade se tourne vers toi.'
    question: Jade te demande ton avis. Que lui conseilles-tu ?
    choix:
      - id: lien-ouvert
        texte: 'Le lien ouvert à tous : c’est pratique, chacun ajoute ses photos.'
        qualite: risque
        reaction: 'Le lien est copié dans un groupe, puis dans un autre. Trois jours plus tard, des inconnus regardent les photos de la fête, avec vos visages et la maison de Jade. Cette option était la plus simple, c’est pour ça qu’on la choisit souvent. Jade peut encore désactiver le lien.'
      - id: invites
        texte: 'Un album réservé aux invités, où chacun peut retirer une photo de lui.'
        qualite: bon
        reaction: 'Jade ajoute les invités un par un. Chacun peut retirer une photo de lui s’il ne l’aime pas. L’album reste entre vous.'
      - id: aide
        texte: 'Je demande de l’aide au père de Jade pour choisir qui verra l’album.'
        qualite: aide
        reaction: 'Le père de Jade vous montre l’option « Invités seulement ». Il ajoute : avant de mettre une photo, on vérifie que les personnes dessus sont d’accord.'
    pourquoi:
      - levier: reflexe
        truc: '« Toute personne avec le lien » : c’est le réglage le plus simple, en un clic.'
        parade: 'Un lien ouvert peut être copié n’importe où. Choisis qui peut entrer.'
      - levier: groupe
        truc: '« Tout le monde pourra ajouter ses photos ! » L’idée plaît à tous les invités.'
        parade: 'Tout le monde, ce n’est pas seulement les invités. Un album réservé fait la même chose, en sécurité.'
      - levier: confiance
        truc: 'Le lien ne circulera qu’entre amis, pense-t-on. Personne ne le partagera ailleurs.'
        parade: 'Un lien se transfère en deux secondes, même sans mauvaise intention. Ferme la porte dès le départ.'
    aRetenir: 'Un lien partagé peut circuler bien au-delà de ceux à qui on l’a donné. Pour un album de fête : seulement les invités, et des photos que chacun accepte.'
debrief:
  questions:
    - Pendant la fête, quelle publication était la plus difficile à refuser ?
    - Comment demander à quelqu’un de retirer une photo de toi ?
    - Que faire si une photo de toi circule encore, même après avoir été retirée ?
  reponses: 'Les secrets de l’île : l’adresse d’une amie dans une story, une photo publiée et identifiée sans accord, une vidéo drôle pour certains mais pas pour tous, un lien d’album ouvert à tous. Pour faire retirer une photo, on peut le dire soi-même à la personne, en privé et au calme, ou se faire aider par un adulte : les deux marchent. Si la photo a été copiée ailleurs : capture, signalement à la plateforme pour atteinte au droit à l’image, et si elle reste en ligne, un adulte peut saisir la CNIL ou appeler le 3018. Et dans l’autre sens : avant de publier quelqu’un, on lui demande.'
  erreursFrequentes:
    - 'Croire qu’une photo prise entre amis peut être publiée parce que tout le monde riait.'
    - 'Penser qu’il est trop tard pour agir quand une photo a déjà été vue ou copiée.'
    - 'Laisser les réglages par défaut : tout le monde peut t’identifier et tes photos s’affichent seules.'
fiche:
  deroulement: |
    5 min : cadre. Qui décide de ce qu’on publie de nous ? (sans obligation de raconter une situation vécue)
    20 min : traversée de l’île, en binômes ou en classe entière vidéoprojetée. Après la fête, deux routes : régler soi-même avec Malo, ou avec la mère de Jade. Si plusieurs binômes jouent, répartir les deux routes.
    20 min : débrief des 3 questions. Faire raconter chaque route : ce qu’on règle soi-même (message à Malo, réglages d’identification, accord avant de publier), ce qu’un adulte rend possible (médiation, signalement, 3018).
    5 min : où trouver de l’aide (adulte de confiance, CPE, signalement dans l’appli, 3018, plainte auprès de la CNIL si une photo reste en ligne).
    5 min : engagement. Cette semaine, je vérifie qui peut m’identifier sur mes applis, et je demande avant de publier la photo d’un ami.
