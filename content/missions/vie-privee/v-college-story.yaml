id: v-college-story
theme: vie-privee
tranches: ['5e-3e']
titre: Je suis où, là ?
resume: 'Une story qui montre ta position en direct, la photo d’un ami qu’il veut voir disparaître, un quiz rigolo qui pose de drôles de questions : garde la main sur ce que tu partages.'
duree: 20
objectifs:
  - Repérer ce qu’une publication révèle (position en direct, réponses aux questions secrètes)
  - Respecter le droit à l’image des autres et retirer une photo quand on me le demande
  - Régler un compte pour choisir qui voit quoi
competences:
  crcn: ['4.2', '2.2', '2.4']
  programmes: ['EMI cycle 4']
etapes:
  - type: scenario
    id: story-position
    ecran:
      app: social
      appNom: SnapTalk
      contact: 'Ta story'
      messages:
        - de: contact
          texte: 'Story publiée : « Aprèm au skate-park 🛹 ». Position en direct activée : tes abonnés te voient sur la carte jusqu’à ce que tu l’arrêtes.'
        - de: contact
          texte: 'Nolan_skt a répondu à ta story : « Je te vois sur la carte, t’es encore là dans 10 min ? »'
    question: 'Tu as 400 abonnés, dont beaucoup que tu ne connais pas en vrai. Nolan_skt, tu ne le connais pas. Tes potes doivent te rejoindre plus tard. Que fais-tu ?'
    choix:
      - id: laisse
        texte: 'Avec la carte, mes potes me trouveront facilement : je laisse ma position et j’ignore Nolan.'
        qualite: risque
        consequence: 'Tes potes te rejoignent, oui. Mais Nolan_skt aussi : il arrive vingt minutes plus tard et t’appelle par ton prénom. Tu n’as jamais vu ce garçon, et lui sait exactement où tu es. Tu peux couper ta position tout de suite et en parler à un adulte.'
      - id: fantome
        texte: 'Je coupe la position, je ne réponds pas et j’envoie l’adresse à mes potes en privé.'
        qualite: bon
        consequence: 'Ta story reste en ligne, sans la carte. Tes potes arrivent grâce à ton message. Nolan_skt ne sait plus où tu es.'
      - id: aide
        texte: Je demande de l’aide à un adulte de confiance, par message, avant de faire quoi que ce soit.
        qualite: aide
        consequence: 'Ta grande sœur te répond tout de suite : « Coupe la position, ne réponds pas, je t’appelle. » Elle reste au téléphone avec toi jusqu’à l’arrivée de tes potes.'
    indices:
      - { id: direct, libelle: 'Ma position est partagée en direct, sans limite de temps', pertinent: true }
      - { id: abonnes, libelle: 'Beaucoup de mes abonnés sont des inconnus', pertinent: true }
      - { id: inconnu, libelle: 'Un inconnu me dit qu’il me voit sur la carte', pertinent: true }
      - { id: emoji-skate, libelle: 'La story a un emoji skate', pertinent: false }
    explicationIndices: 'Une position en direct dit où tu es à la minute près, à tous ceux qui voient ta story. Un inconnu qui te le fait remarquer, c’est le signal d’alarme. L’emoji, lui, ne dit rien de dangereux.'
    aRetenir: 'La position en direct, on la partage rarement, avec quelques proches choisis, et on l’arrête dès que c’est fini. Pour te retrouver, un message privé à tes potes suffit.'
    recuperation: { action: demander-aide, siChoix: [laisse] }
    pourquoi:
      - levier: reflexe
        truc: '« Position en direct activée » : l’option s’est allumée avec la story, et on ne la remarque pas.'
        parade: 'Avant de publier une story, regarde les petites icônes : position, public, durée. Coupe ce qui ne sert pas.'
      - levier: gain
        truc: 'La carte, c’est pratique : tes potes te trouvent sans que tu aies besoin d’expliquer où tu es.'
        parade: 'Envoie plutôt l’adresse à tes potes en message privé. C’est aussi pratique, et seuls eux la voient.'
      - levier: groupe
        truc: 'Beaucoup de gens laissent leur position allumée, alors ça paraît normal.'
        parade: 'Que d’autres le fassent ne te protège pas. Choisis le mode fantôme par défaut.'
      - levier: confiance
        truc: '« T’es encore là dans 10 min ? » : Nolan_skt parle comme un skateur du coin. Tu ne sais pourtant pas qui il est.'
        parade: 'Un inconnu qui sait où tu es, on ne lui répond pas. On coupe la position et on prévient un adulte.'

  - type: scenario
    id: photo-ami
    role: auteur
    ecran:
      app: chat
      appNom: ChatCord
      contact: 'Yanis'
      messages:
        - de: contact
          texte: 'Tu peux enlever la photo de moi à la piscine stp ? Je l’aime pas du tout.'
        - de: contact
          texte: 'Y a des gens de la classe qui se moquent dans les commentaires 😕'
    question: 'Tu as publié cette photo hier sans demander à Yanis. Elle a déjà 85 likes, et tu la trouves drôle. Que fais-tu ?'
    choix:
      - id: garde
        texte: 'Elle a 85 likes, et c’est juste pour rire : je la laisse, ça va passer.'
        qualite: risque
        consequence: 'Les moqueries continuent dans les commentaires et Yanis ne te parle plus. Chacun décide de ce qu’on publie de lui : c’est son droit à l’image, et Yanis peut demander à la plateforme de retirer la photo. Tu peux encore la retirer maintenant et t’excuser.'
      - id: retire
        texte: 'Je la retire tout de suite, je m’excuse auprès de Yanis, et je supprime aussi les commentaires moqueurs.'
        qualite: bon
        consequence: 'Yanis te répond : « Merci, c’est cool. » La prochaine fois, tu lui demanderas avant de publier une photo de lui.'
      - id: aide
        texte: 'Je demande de l’aide à quelqu’un de confiance, parce que je ne sais pas comment arranger les choses avec Yanis.'
        qualite: aide
        consequence: 'Ton cousin te conseille : « Retire la photo et dis-lui pardon. C’est son image, c’est à lui de décider. » Tu le fais le soir même.'
    indices:
      - { id: demande, libelle: 'Yanis me demande clairement de retirer la photo', pertinent: true }
      - { id: sans-accord, libelle: 'Je l’ai publiée sans lui demander', pertinent: true }
      - { id: moqueries, libelle: 'Des gens se moquent de lui dans les commentaires', pertinent: true }
      - { id: likes, libelle: 'La photo a beaucoup de likes', pertinent: false }
    explicationIndices: 'Chacun décide de ce qu’on montre de lui en ligne : c’est le droit à l’image. Quand une photo entraîne des moqueries, la laisser en ligne les entretient. Le nombre de likes ne change rien à cela.'
    aRetenir: 'Avant de publier la photo de quelqu’un, demande-lui. S’il te demande de la retirer, retire-la. Et si quelqu’un refuse de retirer une photo de toi, tu peux la signaler à la plateforme et demander de l’aide à un adulte.'
    recuperation: { action: demander-aide, siChoix: [garde] }
    pourquoi:
      - levier: gain
        truc: '85 likes, c’est flatteur. On n’a pas envie de supprimer une publication qui marche.'
        parade: 'Retire la photo : c’est Yanis qui décide de son image, pas le nombre de likes.'
      - levier: groupe
        truc: 'Les autres commentent et rigolent, alors on se dit que ce n’est pas si grave.'
        parade: 'Si la personne sur la photo ne rit pas, ce n’est plus une blague. Retire-la et supprime les moqueries.'
      - levier: reflexe
        truc: 'On publie la photo d’un ami sans y penser, comme on publierait une photo de soi.'
        parade: 'Avant de publier quelqu’un d’autre, pose-lui une question simple : « Je peux la poster ? »'

  - type: scenario
    id: quiz-securite
    ecran:
      app: social
      appNom: SnapTalk
      contact: 'Quiz Mania'
      messages:
        - de: contact
          texte: 'Quel est ton nom de héros ? 🦸 Le nom de ton premier animal + le nom de ta rue ! Écris-le en commentaire 👇'
        - de: contact
          texte: 'Exemple : « Caramel des Lilas » 😂 Déjà 312 commentaires, tous tes amis ont joué !'
    question: 'Ton amie Léa a partagé ce quiz, et la moitié de ta classe a déjà répondu. Que fais-tu ?'
    choix:
      - id: commente
        texte: 'Tous mes amis ont joué et c’est trop drôle : j’écris mon nom de héros en commentaire.'
        qualite: risque
        consequence: 'Le nom de ton premier animal, c’est la réponse à la « question secrète » de ton compte GameBox. Une semaine plus tard, tu reçois un mail : « Ta question secrète a été utilisée pour changer ton mot de passe. » Quelqu’un a lu ton commentaire. Tu peux encore reprendre ton compte.'
      - id: passe
        texte: 'Je ne réponds pas : premier animal et nom de rue, ce sont des réponses à des questions secrètes. Je préviens Léa.'
        qualite: bon
        consequence: 'Léa n’y avait pas pensé. Elle supprime son commentaire et prévient le groupe de classe. Ton nom de rue et ton premier animal restent à toi.'
      - id: aide
        texte: Je demande de l’aide à un adulte pour savoir si ce quiz est sans risque.
        qualite: aide
        consequence: 'Ton père sourit : « Premier animal, nom de la rue… ce sont les questions secrètes de plein de sites ! » Vous ne répondez pas.'
    indices:
      - { id: questions-secretes, libelle: 'Le quiz demande le nom de mon premier animal', pertinent: true }
      - { id: rue, libelle: 'Il demande aussi le nom de ma rue', pertinent: true }
      - { id: public, libelle: 'Les réponses sont publiques, en commentaire', pertinent: true }
      - { id: emoji-heros, libelle: 'Il y a un emoji super-héros', pertinent: false }
    explicationIndices: 'Premier animal, nom de rue, ville de naissance : ce sont des questions secrètes classiques pour récupérer un compte. En commentaire public, n’importe qui peut les lire. Ton nom de rue dit aussi où tu habites.'
    aRetenir: 'Les quiz qui demandent ton premier animal, ta rue ou ta date de naissance récoltent les réponses de tes questions secrètes. Ne réponds pas en public. Et pour une question secrète, choisis une réponse que personne ne peut deviner.'
    recuperation: { action: changer-mdp, siChoix: [commente] }
    pourquoi:
      - levier: groupe
        truc: '« Tous tes amis ont joué ! » : on ne veut pas être le seul à ne pas répondre.'
        parade: 'Tu peux liker le quiz sans y répondre. Et préviens tes amis : ils se protègent aussi.'
      - levier: confiance
        truc: 'C’est ton amie Léa qui l’a partagé. Mais Léa ne sait pas qui a créé « Quiz Mania ».'
        parade: 'Un quiz partagé par une amie peut être un piège. Regarde ce qu’il te demande, pas qui le partage.'
      - levier: reflexe
        truc: '« Caramel des Lilas » 😂 : l’exemple est drôle, et on écrit sa réponse sans réfléchir.'
        parade: 'Avant de répondre à un quiz, demande-toi : est-ce que cette info pourrait ouvrir un de mes comptes ?'

  - type: minijeu
    id: mj-reglages-story
    jeu: confidentialite
    config:
      consigne: Voici les réglages de ton compte SnapTalk. Règle chacun pour garder la main sur ce que tu partages, puis vérifie ton profil.
      appNom: SnapTalk
      reglages:
        - id: compte
          libelle: Type de compte
          options:
            - { id: public, libelle: Public }
            - { id: prive, libelle: Privé }
          initial: public
          conseille: prive
          explication: 'Avec un compte privé, tu acceptes toi-même chaque abonné. Les inconnus ne voient plus tes publications.'
        - id: position
          libelle: Ma position sur la carte
          options:
            - { id: tous, libelle: Visible par tout le monde }
            - { id: amis, libelle: Visible par mes amis }
            - { id: fantome, libelle: Mode fantôme (personne) }
          initial: tous
          conseille: fantome
          explication: 'Le mode fantôme cache ta position. Si tu dois retrouver tes potes, envoie-leur l’adresse en message.'
        - id: stories
          libelle: Qui peut voir mes stories ?
          options:
            - { id: tous, libelle: Tout le monde }
            - { id: amis, libelle: Mes amis }
          initial: tous
          conseille: amis
          explication: 'Tes stories montrent souvent où tu es et avec qui. Réserve-les à tes amis.'
        - id: identification
          libelle: Quand quelqu’un m’identifie sur une photo
          options:
            - { id: direct, libelle: Elle apparaît directement sur mon profil }
            - { id: valider, libelle: Je la valide avant }
          initial: direct
          conseille: valider
          explication: 'Ainsi, tu choisis les photos de toi qui s’affichent sur ton profil. Tu peux refuser celles qui te gênent.'
        - id: messages
          libelle: Qui peut m’envoyer un message ?
          options:
            - { id: tous, libelle: Tout le monde }
            - { id: amis, libelle: Mes amis }
          initial: amis
          conseille: amis
          explication: 'Bon réglage : les inconnus ne peuvent pas t’écrire directement.'
        - id: college
          libelle: Afficher mon collège sur mon profil
          options:
            - { id: oui, libelle: Oui }
            - { id: non, libelle: Non }
          initial: oui
          conseille: non
          explication: 'Ton collège dit où te trouver en semaine. Tes vrais amis le savent déjà.'
debrief:
  questions:
    - Quel était le piège ?
    - Quel indice pourras-tu réutiliser la prochaine fois ?
    - Que faire si ça t’est déjà arrivé ?
  reponses: 'Le piège commun : partager sans y penser des informations qui en disent long (où tu es en ce moment, les réponses à tes questions secrètes) ou l’image de quelqu’un d’autre sans son accord. Indices réutilisables : l’icône de position avant de publier, un inconnu qui sait où tu es, un quiz qui demande premier animal, rue ou date de naissance, un ami qui demande de retirer une photo. Si c’est déjà arrivé : couper la position et prévenir un adulte, retirer la photo et s’excuser, supprimer le commentaire puis changer le mot de passe et la réponse de la question secrète du compte concerné. Si quelqu’un refuse de retirer une photo de toi : signaler la photo à la plateforme et demander de l’aide. On peut toujours rattraper une publication.'
  erreursFrequentes:
    - 'Croire que la position en direct n’est visible que par ses vrais amis.'
    - 'Penser qu’une photo d’un ami « pour rire » ne pose pas de problème si elle a beaucoup de likes.'
    - 'Voir les quiz comme de simples jeux, sans penser aux questions secrètes des comptes.'
fiche:
  deroulement: |
    5 min : cadre. Qui sait où trouver le réglage de position de son appli préférée ? (sans obligation de montrer son téléphone)
    20 min : jeu, en binômes ou en classe entière vidéoprojetée.
    20 min : débrief des 3 questions, puis retour sur le mini-jeu (le réglage de position et la validation des identifications).
    5 min : où trouver de l’aide (adulte de confiance, CPE, signalement dans l’appli, 3018 si une photo circule sans accord).
    5 min : engagement. Cette semaine, je vérifie le réglage de position de mes applis et je demande avant de publier la photo d’un ami.
